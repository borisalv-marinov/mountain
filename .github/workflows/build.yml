name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install yamllint
        run: pip install yamllint
      - name: Check recipe YAML
        run: yamllint -d relaxed recipes/
      - name: Static image rules (the repo tree checked as the image, before the long build)
        run: bash tests/check-image-static.sh
      - name: Test lite mode
        run: bash tests/test-lite-mode.sh
      - name: Test first-login setup
        run: bash tests/test-user-setup.sh
      - name: Test AI launcher
        run: bash tests/test-mountain-ai.sh
      - name: Test Try Mountain keysyms
        run: node try/keysym.test.mjs
      - name: Test Game Mode
        run: bash tests/test-gamemode.sh
      - name: Test taskbar migration for old accounts
        run: bash tests/test-taskbar-migrate.sh
      - name: Test Task Manager helper
        run: bash tests/test-taskmanager.sh
      - name: Test Restart into Windows detection
        run: bash tests/test-windows-boot.sh
      - name: Test App permissions helper
        run: bash tests/test-app-permissions.sh
      - name: Test Accessibility helper
        run: bash tests/test-accessibility.sh
      - name: Test Active Protection rules
        run: bash tests/test-protect.sh
      - name: Test virus scan moves threats to quarantine
        run: bash tests/test-security-scan.sh
      - name: Test Active Protection watcher end to end
        run: printf 'http://azure.archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://mirrors.edge.kernel.org/ubuntu/\tpriority:2\nhttp://archive.ubuntu.com/ubuntu/\tpriority:3\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null && echo 'Acquire::ForceIPv4 "true"; Acquire::Retries "5"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-mountain-retries >/dev/null && sudo apt-get update -qq && sudo apt-get install -y -qq inotify-tools >/dev/null && bash tests/test-protect-daemon.sh
      - name: Workflow actions are pinned and build scripts executable
        run: bash tests/test-workflow-pins.sh
      - name: Test snapshot keep rule
        run: bash tests/test-snapshot-prune.sh
      - name: Mountain's own windows have Bulgarian (catalogs built, no English text outside i18n)
        run: bash tests/test-i18n.sh
      - name: vm-test carries the current hwsim.sh
        run: bash -n tests/vm/hwsim.sh && grep -oE 'echo [A-Za-z0-9+/=]+ \| base64 -d > /tmp/hwsim.sh' .github/workflows/vm-test.yml | cut -d' ' -f2 | base64 -d | cmp - tests/vm/hwsim.sh
      - name: File Explorer opens Desktop folders through desktop:/
        run: bash tests/test-explorer.sh
      - name: Firewall profile picks the default-route connection
        run: bash tests/test-security-conn.sh
      - name: KWin flyout scripts load and open on their shortcuts (Win+V, Win+Z)
        run: | # Qt needs the EGL/GL and xkb client libraries even offscreen (Ubuntu's runner image lacks libEGL)
          printf 'http://azure.archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://mirrors.edge.kernel.org/ubuntu/\tpriority:2\nhttp://archive.ubuntu.com/ubuntu/\tpriority:3\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null && echo 'Acquire::ForceIPv4 "true"; Acquire::Retries "5"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-mountain-retries >/dev/null && sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 >/dev/null
          pip install -q pyside6==6.11.1 && QT_QPA_PLATFORM=offscreen python tests/test-kwin-qml.py
      - name: Run dialog (Win+R) test
        run: bash tests/test-run-dialog.sh
      - name: Check Flathub IDs
        run: bash tests/check-flathub-ids.sh
      - name: User-view checker reads screenshots right (OCR and window colour)
        run: |
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr python3-pil fonts-dejavu-core >/dev/null
          python3 tests/vm/test_uxcheck.py && bash -n tests/vm/start-apps.sh
      - name: Shadow margins match corners
        run: python3 tests/shadowcheck.py files/system/usr/share/plasma/desktoptheme/mountain-glass

  bluebuild:
    name: Build Custom Image
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
          - recipe-nvidia.yml
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Publish gate: check-image.sh is the last recipe module, so a failing check fails the build before the push.
      # The generated copy is not committed (.gitignore: files/scripts/check-image.sh).
      - name: Add the image checker as the last recipe step
        run: cp tests/check-image.sh files/scripts/check-image.sh
      - name: Build Custom Image
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1.13
        with:
          skip_checkout: true
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true

  test:
    name: Test Image
    needs: bluebuild
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: [mountain, mountain-nvidia]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Log in to ghcr.io
        run: echo ${{ github.token }} | podman login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Install skopeo
        run: command -v skopeo >/dev/null || { printf 'http://azure.archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://mirrors.edge.kernel.org/ubuntu/\tpriority:2\nhttp://archive.ubuntu.com/ubuntu/\tpriority:3\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null && echo 'Acquire::ForceIPv4 "true"; Acquire::Retries "5"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-mountain-retries >/dev/null && sudo apt-get update && sudo apt-get install -y skopeo; }
      - name: Find image tag
        id: tag
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SAFE="${BRANCH//\//_}" # BlueBuild tags a branch with a slash as br-<a>_<b>-<ver>
          ALL=$(skopeo list-tags "docker://ghcr.io/borisalv-marinov/${{ matrix.image }}" | jq -r '.Tags[]')
          TAG=$(echo "$ALL" | grep -F -- "$SAFE" | sort -V | tail -n 1 || true)
          if [ -z "$TAG" ]; then
            echo "::error::No image tag contains '$SAFE'. All tags:"
            echo "$ALL"
            exit 1
          fi
          echo "Using tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Run image tests
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: podman run --rm --no-hostname -v "$PWD/tests:/tests:ro" "ghcr.io/borisalv-marinov/${{ matrix.image }}:$TAG" bash /tests/check-image.sh

name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install yamllint
        run: pip install yamllint
      - name: Check recipe YAML
        run: yamllint -d relaxed recipes/
      - name: Test lite mode
        run: bash tests/test-lite-mode.sh
      - name: Test first-login setup
        run: bash tests/test-user-setup.sh
      - name: Test AI launcher
        run: bash tests/test-mountain-ai.sh
      - name: Test Try Mountain keysyms
        run: node try/keysym.test.mjs
      - name: Test Task Manager helper
        run: bash tests/test-taskmanager.sh
      - name: Test Restart into Windows detection
        run: bash tests/test-windows-boot.sh
      - name: Test Active Protection rules
        run: bash tests/test-protect.sh
      - name: Test snapshot keep rule
        run: bash tests/test-snapshot-prune.sh
      - name: File Explorer opens Desktop folders through desktop:/
        run: bash tests/test-explorer.sh
      - name: Firewall profile picks the default-route connection
        run: bash tests/test-security-conn.sh
      - name: KWin flyout scripts load and open on their shortcuts (Win+V, Win+Z)
        run: | # Qt needs the EGL/GL and xkb client libraries even offscreen (Ubuntu's runner image lacks libEGL)
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 >/dev/null
          pip install -q pyside6==6.11.1 && QT_QPA_PLATFORM=offscreen python tests/test-kwin-qml.py
      - name: Run dialog (Win+R) test
        run: bash tests/test-run-dialog.sh
      - name: Check Flathub IDs
        run: bash tests/check-flathub-ids.sh

  bluebuild:
    name: Build Custom Image
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
          - recipe-nvidia.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Publish gate: check-image.sh is the last recipe module, so a failing check fails the build before the push.
      # The generated copy is not committed (.gitignore: files/scripts/check-image.sh).
      - name: Add the image checker as the last recipe step
        run: cp tests/check-image.sh files/scripts/check-image.sh
      - name: Build Custom Image
        uses: blue-build/github-action@v1.13
        with:
          skip_checkout: true
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true

  test:
    name: Test Image
    needs: bluebuild
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: [mountain, mountain-nvidia]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Log in to ghcr.io
        run: echo ${{ github.token }} | podman login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Install skopeo
        run: command -v skopeo >/dev/null || { sudo apt-get update && sudo apt-get install -y skopeo; }
      - name: Find image tag
        id: tag
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SAFE="${BRANCH//\//-}"
          ALL=$(skopeo list-tags "docker://ghcr.io/borisalv-marinov/${{ matrix.image }}" | jq -r '.Tags[]')
          TAG=$(echo "$ALL" | grep -F -- "$SAFE" | sort -V | tail -n 1 || true)
          if [ -z "$TAG" ]; then
            echo "::error::No image tag contains '$SAFE'. All tags:"
            echo "$ALL"
            exit 1
          fi
          echo "Using tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Run image tests
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: podman run --rm --no-hostname -v "$PWD/tests:/tests:ro" "ghcr.io/borisalv-marinov/${{ matrix.image }}:$TAG" bash /tests/check-image.sh

name: Try Mountain
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep the desktop open (max 300)"
        default: "240"
        type: string

jobs:
  try:
    name: Mountain desktop in your browser
    runs-on: ubuntu-24.04 # 26.04 denies bib mounts
    timeout-minutes: 350
    permissions:
      contents: read
      packages: read
      statuses: write # live link readable while the run is going
    env:
      IMG: mountain
      BRANCH: ${{ github.ref_name }}
      TRY_PASSWORD: ${{ secrets.TRY_PASSWORD }}
      MINUTES: ${{ inputs.minutes || '240' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: try
      - name: Check inputs
        run: |
          [ -n "$TRY_PASSWORD" ] || { echo "::error::secret TRY_PASSWORD is missing"; exit 1; }
          [[ "$MINUTES" =~ ^[0-9]+$ ]] && [ "$MINUTES" -ge 1 ] && [ "$MINUTES" -le 300 ] || { echo "::error::minutes must be 1-300"; exit 1; }
          echo "::add-mask::${TRY_PASSWORD:0:8}"

      - name: Enable KVM and install tools
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # Azure apt mirror outages break installs; use the main Ubuntu mirror with retries.
          echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          echo "Acquire::Retries \"5\";" | sudo tee /etc/apt/apt.conf.d/80retries
          sudo apt-get update
          sudo apt-get install -y qemu-utils socat skopeo novnc websockify
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Install cloudflared
        run: |
          curl -fsSL -o cf.deb https://github.com/cloudflare/cloudflared/releases/download/2025.8.1/cloudflared-linux-amd64.deb
          sudo dpkg -i cf.deb
          cloudflared --version

      - name: Find image tag
        id: tag
        run: |
          SAFE="${BRANCH//\//-}"
          # main builds are tagged "latest", branch builds "br-<branch>-<ver>"
          if [ "$BRANCH" = main ]; then echo "tag=latest" >> "$GITHUB_OUTPUT"; echo "Using tag: latest"; exit 0; fi
          ALL=$(skopeo list-tags "docker://ghcr.io/borisalv-marinov/$IMG" | jq -r '.Tags[]')
          TAG=$(echo "$ALL" | grep -F -- "$SAFE" | sort -V | tail -n 1 || true)
          [ -n "$TAG" ] || { echo "::error::no tag contains $SAFE"; echo "$ALL"; exit 1; }
          echo "Using tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build qcow2 with bootc-image-builder
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p "$HOME/vm" && cd "$HOME/vm"
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          REF="ghcr.io/borisalv-marinov/$IMG:$TAG"
          echo 'mountain:123' > pw # desktop password for this throwaway try VM (owner's choice)
          # ready signal: prints MOUNTAIN-READY on the serial port once the default flatpaks are installed
          cat > ready.sh <<'SH'
          #!/bin/bash
          for _ in $(seq 100); do
            L=$(flatpak list --app --columns=application 2>/dev/null); ok=1
            for a in dev.vencord.Vesktop com.discordapp.Discord com.microsoft.Edge org.onlyoffice.desktopeditors com.heroicgameslauncher.hgl org.mozilla.firefox; do
              grep -qx "$a" <<<"$L" || ok=0
            done
            [ $ok = 1 ] && { echo MOUNTAIN-READY > /dev/ttyS0; exit 0; }
            sleep 15
          done
          echo MOUNTAIN-READY-TIMEOUT > /dev/ttyS0
          SH
          cat > ready.service <<'UNIT'
          [Unit]
          Description=Mountain Try: signal when default apps are installed
          After=graphical.target
          [Service]
          ExecStart=/usr/libexec/mountain-try-ready.sh
          [Install]
          WantedBy=graphical.target
          UNIT
          # derived image: user with password 123 and no autologin, so the lock screen shows first (the shipped image stays untouched)
          cat > Containerfile <<EOF
          FROM $REF
          COPY ready.sh /usr/libexec/mountain-try-ready.sh
          COPY ready.service /usr/lib/systemd/system/mountain-try-ready.service
          RUN chmod +x /usr/libexec/mountain-try-ready.sh && systemctl enable mountain-try-ready.service
          # copy/paste agent (already in Bazzite; socket-activated on Fedora)
          RUN rpm -q spice-vdagent && systemctl enable spice-vdagentd.socket || true
          RUN --mount=type=bind,source=pw,target=/pw \
              useradd -m -G wheel -c Mountain mountain && chpasswd < /pw \
           && echo 'mountain ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/zz-mountain-try \
           && mkdir -p /etc/polkit-1/rules.d && printf 'polkit.addRule(function(a,s){if(s.user=="mountain")return polkit.Result.YES;});\n' > /etc/polkit-1/rules.d/49-mountain-try.rules \
           && mkdir -p /home/mountain/.config \
           && printf '[Wallet]\nEnabled=false\nFirst Use=false\n' > /home/mountain/.config/kwalletrc \
           && mkdir -p /home/mountain/.config/autostart && printf '[Desktop Entry]\nHidden=true\n' > /home/mountain/.config/autostart/mountain-lite-mode.desktop \
           && mkdir -p /home/mountain/.var/app/com.microsoft.Edge/config && echo --disable-gpu | tee /home/mountain/.var/app/com.microsoft.Edge/config/edge-flags.conf > /home/mountain/.var/app/com.microsoft.Edge/config/msedge-flags.conf && chown -R mountain:mountain /home/mountain/.var \
           && printf '[KDE]\nDoubleClickInterval=800\n' > /home/mountain/.config/kdeglobals \
           && chown -R mountain:mountain /home/mountain/.config
          EOF
          sudo podman build -t localhost/mountain-try:latest .
          rm pw
          # room for the first-boot apps and Steam (bib's default root filled up: "Low Disk Space")
          printf '[[customizations.filesystem]]\nmountpoint = "/"\nminsize = "40 GiB"\n' > config.toml
          mkdir -p output
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t --security-opt apparmor=unconfined \
            -v "$PWD/config.toml:/config.toml:ro" \
            -v "$PWD/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 --rootfs btrfs --local localhost/mountain-try:latest
          sudo chown -R "$USER" output
          mv output/qcow2/disk.qcow2 disk.qcow2
          sudo podman rmi -af >/dev/null 2>&1 || true
          qemu-img resize disk.qcow2 64G
          df -h /

      - name: Boot VM and set VNC password
        run: |
          cd "$HOME/vm"
          cat > qemu.sh <<'QS'
          #!/bin/bash
          set -e
          dnf -y -q install qemu-kvm edk2-ovmf >/vm/dnf.log 2>&1
          dnf -y -q install qemu-device-display-virtio-gpu qemu-device-display-virtio-vga >>/vm/dnf.log 2>&1 || true
          D=/usr/share/edk2/ovmf
          for p in OVMF_CODE_4M.fd:OVMF_VARS_4M.fd OVMF_CODE.fd:OVMF_VARS.fd; do
            [ -e "$D/${p%:*}" ] && [ -e "$D/${p##*:}" ] && { CODE="$D/${p%:*}"; cp "$D/${p##*:}" /vm/vars.fd; break; }
          done
          [ -n "$CODE" ] || { ls -R /usr/share/edk2 >>/vm/dnf.log; exit 1; }
          exec qemu-system-x86_64 -enable-kvm -cpu host -m 10240 -smp $(nproc) -machine q35             -drive if=pflash,format=raw,readonly=on,file="$CODE"             -drive if=pflash,format=raw,file=/vm/vars.fd             -drive file=/vm/disk.qcow2,if=virtio             -nic user,model=virtio-net-pci             -device virtio-vga,xres=1600,yres=900,edid=on -vnc 127.0.0.1:0,password=on             -device qemu-xhci -device usb-tablet             -chardev qemu-vdagent,id=vdagent,name=vdagent,clipboard=on -device virtio-serial-pci -device virtserialport,chardev=vdagent,name=com.redhat.spice.0             -monitor unix:/tmp/qmon,server,nowait -qmp unix:/tmp/qmp,server,nowait -serial file:/vm/serial.log
          QS
          date +%s > boot_start
          sudo podman run -d --name qemu --privileged --network host --device /dev/kvm -v "$HOME/vm:/vm" -v /tmp:/tmp quay.io/fedora/fedora:latest bash /vm/qemu.sh
          for _ in $(seq 450); do [ -e /tmp/qmon ] && break; sleep 2; done # dnf in the container can be slow on a bad mirror
          [ -e /tmp/qmon ] || { sudo podman logs qemu; tail -30 dnf.log; echo "::error::qemu did not start"; exit 1; }
          sleep 2
          # VNC passwords are max 8 characters
          echo "set_password vnc ${TRY_PASSWORD:0:8}" | sudo socat - UNIX-CONNECT:/tmp/qmon >/dev/null

      - name: Wait for the desktop to be ready
        run: |
          cd "$HOME/vm"
          for _ in $(seq 120); do
            grep -q 'MOUNTAIN-READY' serial.log && break; sleep 15
          done
          grep -q 'MOUNTAIN-READY' serial.log || echo "not ready after 30 min"

      - name: Start noVNC and tunnel
        run: |
          cd "$HOME/vm"
          mkdir -p "$HOME/web" && cp -r /usr/share/novnc/. "$HOME/web/" && cp "$GITHUB_WORKSPACE"/try/*.mjs "$GITHUB_WORKSPACE"/try/mountain.html "$HOME/web/"
          ls "$HOME/web/core/rfb.js" # Ubuntu 24.04 novnc ships ES modules; fail loudly if not
          nohup websockify --web "$HOME/web" 127.0.0.1:6080 127.0.0.1:5900 > novnc.log 2>&1 &
          URL=""
          for try in 1 2 3 4 5 6; do # trycloudflare sometimes fails to hand out a quick tunnel; retry
            nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:6080 > cf.log 2>&1 &
            CF=$!
            for _ in $(seq 30); do
              URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' cf.log | head -1 || true)
              [ -n "$URL" ] && break; kill -0 $CF 2>/dev/null || break; sleep 2
            done
            [ -n "$URL" ] && break
            echo "tunnel attempt $try failed:"; tail -3 cf.log; kill $CF 2>/dev/null || true; sleep $((try * 15))
          done
          [ -n "$URL" ] || { cat cf.log; echo "::error::no tunnel URL"; exit 1; }
          echo "::notice title=Mountain link::$URL/mountain.html"
          GH_TOKEN="${{ github.token }}" gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=success -f context="Mountain link" -f description="Open to try Mountain" -f target_url="$URL/mountain.html" >/dev/null || true
          echo "Open $URL/mountain.html — password: the one in your Mountain notes file (first 8 characters)" >> "$GITHUB_STEP_SUMMARY"
          for _ in $(seq 30); do
            C=$(curl -s -o /dev/null -w '%{http_code}' "$URL/mountain.html" || true); [ "$C" = 200 ] && break; sleep 5
          done
          echo "self-check: $URL/mountain.html -> HTTP $C ($(( $(date +%s) - $(cat boot_start) ))s after VM start)"
          echo "The desktop appears a few minutes after this link works (the first start is slow)." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the desktop alive
        run: |
          END=$(( $(date +%s) + MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do sleep 30; done
          echo quit | sudo socat - UNIX-CONNECT:/tmp/qmon || true
          sudo podman rm -f qemu || true

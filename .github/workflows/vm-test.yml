          chk "scan history" 2 "tail -3 ~looktest/.local/share/mountain/scan-history | paste -sd';'" 'scan'
          R "$LT systemctl --user start mountain-protect.service"; sleep 3
          # Active Protection: /tmp, a USB drive, an attachment-like path; unverified scripts and autostart entries; its cost
          apwait() { for _ in $(seq 40); do R "test -e '$1'" || return 0; sleep 3; done; return 1; }

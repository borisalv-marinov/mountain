          printf '\nMETRICS\n- RAM used at desktop: %s MB\n- login-to-desktop: %s s\n- start-menu latency: %s ms\n- boot (systemd-analyze): %s\n\n' "$RAM" "$LTD" "$LAT" "$BT" >> report.md

          R "rm -f /etc/sddm.conf.d/zz-autologin.conf /etc/plasmalogin.conf"
          newboot() { local b; for _ in $(seq 18); do b=$(R "cat /proc/sys/kernel/random/boot_id" 2>/dev/null); [ -n "$b" ] && [ "$b" != "$1" ] && return 0; sleep 10; done; return 1; }
          for n in 1 2; do
            BID=$(R "cat /proc/sys/kernel/random/boot_id")
            R "systemctl reboot" || true; ssh $SSHO -O exit root@127.0.0.1 2>/dev/null # drop the shared connection
            sleep 30
            if wait_ssh 600 && newboot "$BID"; then chk "reboot $n failed units" 0 "systemctl --failed --no-legend | wc -l | xargs test 0 -eq && echo none" '^none$'
              if [ $n = 1 ]; then
                chk "rollback test: new version booted, previous kept" 0 "grep -o mountain.rollbacktest=1 /proc/cmdline; rpm-ostree status --json | python3 -c 'import json,sys; print(len(json.load(sys.stdin)[\"deployments\"]), \"deployments\")'" 'mountain.rollbacktest=1'
                chk "attack: a full disk still boots" 0 "test -e /var/rt-fill && rm -f /var/rt-fill && echo booted-full" '^booted-full$'
                chk "Go back to the previous version" 0 "/usr/libexec/mountain-security rollback 2>&1 | tail -1" 'rollback=staged'
              else
                chk "rollback works: the previous version booted" 0 "grep -q mountain.rollbacktest /proc/cmdline && echo still-new || echo previous" '^previous$'
              fi
            else echo "| reboot $n | FAIL | ssh not back |" >> report.md; fi
          done
          # clean shutdown: the VM must power itself off
          R "systemctl poweroff" || true; ssh $SSHO -O exit root@127.0.0.1 2>/dev/null
          if timeout 180 sudo podman wait qemu >/dev/null 2>&1; then echo "| shutdown | PASS | VM powered off |" >> report.md
          else echo "| shutdown | FAIL | still running after 180 s |" >> report.md; CORE_FAIL=1; fi

          cat report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$CORE_FAIL" = 1 ]; then echo "::error::core check failed"; exit 1; fi
          if grep -q '| FAIL |' report.md; then echo "::error::$(grep -c '| FAIL |' report.md) check(s) failed"; exit 1; fi
      - name: Fix ownership
        if: always()
        run: sudo chown -R "$USER" "$HOME/vm" || true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-test-report
          path: |
            /home/runner/vm/report.md
            /home/runner/vm/*.png
            /home/runner/vm/shots/*.png
            /home/runner/vm/perf/*.txt
            /home/runner/vm/*.txt
            /home/runner/vm/serial.log

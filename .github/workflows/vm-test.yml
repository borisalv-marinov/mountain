          QM key meta_l shift s; wchk "shortcut Win+Shift+S (Snipping Tool)" 0 spectacle 15; sleep 3; shot shortcut-snip; QM key esc; sleep 1; K -x spectacle
          QM key print; wchk "shortcut PrtSc (screenshot)" 0 spectacle 15; sleep 4; K -x spectacle
          chk "screenshots saved" 2 "ls ~looktest/Pictures/Screenshots 2>/dev/null | wc -l" '.'
          KL="$LT dbus-send --session --print-reply --dest=org.kde.keyboard /Layouts org.kde.KeyboardLayouts.getLayout"
          QM key meta_l spc; sleep 2; chk "shortcut Win+Space switches to Bulgarian" 0 "$KL | awk '/uint32/{print \$2}'" '^1$'

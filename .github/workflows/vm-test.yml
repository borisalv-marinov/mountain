          chk "quick settings: Energy saver switches the power profile" 0 "$PP" 'power-saver'
          chk "quick settings: Airplane mode turns radios off" 0 "nmcli -t -f WIFI,WWAN radio" '^disabled:disabled$'
          chk "quick settings: volume slider changes the volume" 0 "$VOL" 'Volume: 0\.(8|9)'
          QM click $((957*W/1280)) $((515*H/800)); QM click $((1201*W/1280)) $((408*H/800)); sleep 2 # back off

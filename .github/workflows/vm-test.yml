          VOL="$LT wpctl get-volume @DEFAULT_AUDIO_SINK@"
          P0=$(R "$PP"); V0=$(R "$VOL"); A0=$(R "nmcli -t -f WIFI,WWAN radio")
          QM click $((957*W/1280)) $((515*H/800)); sleep 3 # Energy saver

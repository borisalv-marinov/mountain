                t=$(( ( $(date +%s%N) - t0 ) / 1000000 ))
                echo "screendump /tmp/o.ppm" | Q >/dev/null; m=$(sudo md5sum < /tmp/o.ppm)
                [ "$m" != "$m0" ] && break; [ $t -ge 30000 ] && break; sleep 0.05
              done
              out="$out $i=${t}ms"; sleep 5; K -f "$3"; sleep 3
            done
            echo "| open $1 (cold/warm) | INFO |$out |" >> report.md; echo "open $1:$out"
          }

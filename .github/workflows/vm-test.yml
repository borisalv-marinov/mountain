          R "cd /home/looktest/Downloads && nohup setsid python3 -m http.server 8099 --bind 127.0.0.1 >/dev/null 2>&1 &"; sleep 2
          redraw_run() { # LABEL
            L flatpak run org.mozilla.firefox --new-window http://127.0.0.1:8099/redraw.html; sleep 35; QM click $((640*W/1280)) $((327*H/800)); sleep 4 # first start shows a welcome dialog (Continue); the sandbox cannot read the home folder, so the page comes from a local web server
            local k a=0 n=0 prev=0 list=""
            for k in 1 2 3 4 5 6; do
              QM key pgdn; sleep 2; shot redraw-ff-$1-$k
              for v in $(convert "$(ls shots/*-redraw-ff-$1-$k.png | tail -1)" - 2>/dev/null | tesseract - stdout --psm 6 2>/dev/null | grep -o 'LINE [0-9]\{4\}' | awk '{print $2+0}'); do
                n=$((n+1)); list="$list $v"; [ "$prev" != 0 ] && [ $((v - prev)) != 1 ] && a=$((a+1)); prev=$v
              done; prev=0
            done
            chk "redraw (blur $1): Firefox scrolled 6 pages, line numbers read back in order" 2 "echo out-of-order=$a read=$n" '.'
            echo "redraw $1 firefox:$list" >> redraw-log.txt
            K -f firefox; sleep 3
            L /usr/libexec/mountain-settings-open privacy; sleep 14
            for k in 1 2 3; do shot redraw-settings-$1-$k; QM key pgdn; sleep 2; done
            QM key alt f4; sleep 2
          }
          redraw_run on
          R "$(TL 'kwriteconfig6 --file kwinrc --group Plugins --key blurEnabled false')"; R "$LT dbus-send --session --dest=org.kde.KWin /KWin org.kde.KWin.reconfigure" || true; sleep 5
          redraw_run off
          R "$(TL 'kwriteconfig6 --file kwinrc --group Plugins --key blurEnabled true')"; R "$LT dbus-send --session --dest=org.kde.KWin /KWin org.kde.KWin.reconfigure" || true; sleep 3
          R "pkill -f 'http.server 8099' || true"
          fi # part redraw
          chk "File Explorer free space facts (0 B free hunt)" 2 "grep -h HomeUrl ~looktest/.config/dolphinrc; getent passwd looktest | cut -d: -f6; stat -f -c 'free=%a*%S' /var/home/looktest /home/looktest; findmnt -T /var/home/looktest -o TARGET,FSTYPE,SOURCE -n; findmnt -T /home/looktest -o TARGET,FSTYPE -n" '.'
          chk "stability: desktop shell and window manager never restarted" 1 "echo \$(pgrep -u looktest -x plasmashell),\$(pgrep -u looktest -x kwin_wayland)" "^$PS0\$"
          # the VM now logs every crash (above; the path is read from any column: a SIZE column can follow it): kioworker is the known open one (register B1, counted in its own row); any other program fails
          chk "stability: no program crashed during the run" 0 "c=\$(coredumpctl list --no-legend --no-pager 2>/dev/null | awk '{for (i = 6; i <= NF; i++) if (substr(\$i, 1, 1) == \"/\") print \$i}' | grep -vx /usr/libexec/kf6/kioworker | sort | uniq -c | paste -sd' '); echo \${c:-none}" '^none$'
          chk "stability: File Explorer helper (kioworker) crashes, known open (B1)" 2 "coredumpctl list --no-legend --no-pager /usr/libexec/kf6/kioworker 2>/dev/null | wc -l" '.'
          chk "stability: kernel crash lines in dmesg (segfault / general protection / int3)" 2 "dmesg | grep -cE 'segfault|general protection|trap int3'" '.'
          # crash probe (kioworker, Dolphin's helper, crashes in the VM while core dumps are off): which /usr file is behind each hash. Never fails the run.
          cat > crash-probe.sh <<'SH'
          exec 2>&1
          echo "== kernel trap lines"; dmesg | grep -E 'segfault|general protection|trap int3' | head -80
          # B1 is traced (KDE's thumbnail worker): the library hunt by hash (up to 10 min) is gone; one stack trace per crashed program instead
          echo "== package"; rpm -qf /usr/lib64/libKF6KIOCore.so.6 /usr/libexec/kf6/kioworker
          echo "== stack traces: the first crash of every program (kioworker shorter, B1 is KDE's own)"
          for e in $(coredumpctl list --no-legend --no-pager 2>/dev/null | awk '{for (i = 6; i <= NF; i++) if (substr($i, 1, 1) == "/") print $i}' | sort -u); do
            p=$(coredumpctl list --no-legend --no-pager "$e" 2>/dev/null | awk '{print $5}' | head -1); [ "$e" = /usr/libexec/kf6/kioworker ] && n=20 || n=60
            echo "-- $e"; coredumpctl info --no-pager "$p" 2>&1 | grep -E 'PID:|Command Line:|Signal:|Stack trace|^ +#[0-9]+ ' | head -$n
            journalctl -b --no-pager -o cat _PID="$p" 2>/dev/null | grep -v '^$' | tail -12 | cut -c1-300
          done
          SH
          R "bash -s" < crash-probe.sh > crash-probe-log.txt 2>&1 || true
          chk "tearing: KWin never lets a window tear" 1 "$LT kreadconfig6 --file kwinrc --group Compositing --key AllowTearing" '^false$'
          chk "tearing: Wayland session (X11 tears)" 1 "loginctl show-session \$(loginctl list-sessions --no-legend | awk '/looktest/{print \$1; exit}') -p Type" 'Type=wayland'
          chk "tearing: KWin support info" 2 "$LT dbus-send --session --print-reply --dest=org.kde.KWin /KWin org.kde.KWin.supportInformation | grep -iE 'tearing|atomic|Compositing Type|OpenGL renderer|Refresh' | head -8 | tr -s ' ' | paste -sd';'" '.'
          R "journalctl -b --no-pager -o cat | grep -o 'MWC|.*'" > perf/windows.txt 2>/dev/null || true
          echo "| window census | INFO | $(cut -d'|' -f3 perf/windows.txt | sort | uniq -c | tr -s ' ' | paste -sd',') |" >> report.md
          # stray windows: every normal/dialog window class of the run is Mountain's own, an app the test opened, or a Start app (list from run 44591138155)
          OWN='org[.]kde[.](dolphin|konsole|kate|kwrite|kcalc|gwenview|haruna|kamoso|kclock|okular|kolourpaint|krecorder|skanlite|spectacle|ark|filelight|kfind|kinfocenter|kmenuedit|krdc|krfb|kdeconnect[.]app|plasma-systemmonitor|plasma[.]emojier|plasmawindowed|polkit-kde-authentication-agent-1)|org[.]freedesktop[.]impl[.]portal[.]desktop[.]kde|org[.]gnome[.]World[.]PikaBackup|io[.]github[.](kolunmi[.]Bazaar|rfrench3[.]bazzite-updater|ublue_os[.]yafti_gtk)|com[.](brave[.]Browser|discordapp[.]Discord|heroicgameslauncher[.]hgl|microsoft[.](Edge|VSCode))|dev[.]vencord[.]Vesktop|org[.]mozilla[.]firefox|net[.]lutris[.]Lutris|gnome-disks|ONLYOFFICE|Waydroid|kwin_wayland|mountain-(boosteroid|geforcenow|xboxcloud)|webapp-manager[.]py|zenity'
          UNEXP=$(awk -F'|' '$2=="add" && ($3=="normal"||$3=="dialog") && $4!=""{print $4}' perf/windows.txt | sort -u | grep -ivxE "$OWN" | paste -sd' ')
          echo "| stray windows: every window class is Mountain's own or an app the test opened | $([ -z "$UNEXP" ] && echo PASS || echo INFO) | unexpected: ${UNEXP:-none} |" >> report.md
          echo "| windows drawing their own title bar | INFO | $(awk -F'|' '$3=="normal" && $7=="noborder"{print $4}' perf/windows.txt | sort -u | paste -sd' ') |" >> report.md
          echo "| on-screen pop-ups seen (volume, brightness, keyboard) | INFO | $(awk -F'|' '$3=="osd"{print $6}' perf/windows.txt | sort -u | paste -sd'/') |" >> report.md

          # v7.3 style: a toast leaves after 5 s unless the pointer rests on it (Plasma pauses the timer only while hovered, no idle logic)
          # and GTK apps get Mountain's dark (shipped gtk.css; their body colour is judged on the every-* shots by tests/vm/ux-rules.json)
          chk "v7.3 style: gtk.css (libadwaita colours) in the account" 0 "grep -c mountain-gtk ~looktest/.config/gtk-4.0/gtk.css ~looktest/.config/gtk-3.0/gtk.css | paste -sd' '" 'gtk-4.0/gtk.css:1 .*gtk-3.0/gtk.css:1'
          chk "v7.3 style: Flatpak apps see the GTK css folders" 0 "flatpak override --system --show 2>/dev/null | grep -c 'xdg-config/gtk-4.0:ro'" '^1$'
          R "$LT notify-send -a 'Test app' 'Pointer toast test' 'Leaves by itself.'"; sleep 1; QM move $((W/2)) $((H/3)); sleep 8; shot toast-pointer-away # ux-rules: no "Pointer toast test" left
          if part session; then
          # 11. logout
          K -x kdebugsettings; R "$LT flatpak kill com.microsoft.Edge" || true; QM key esc
          R "lsblk -o NAME,FSTYPE,LABEL,RO,SIZE,MOUNTPOINTS; udisksctl dump" > perf/drives.txt 2>&1 || true
          chk "drives seen by udisks" 2 "lsblk -o NAME,FSTYPE,LABEL,RO,MOUNTPOINTS | tr \"\n\" \";\"; udisksctl dump | grep -E \"^/org|HintIgnore|IdType:\" | tr \"\n\" \" \" | cut -c1-600" '.'
          R "$LT dbus-send --session --type=method_call --dest=org.kde.Shutdown /Shutdown org.kde.Shutdown.logout" || true
          LO=fail
          for _ in $(seq 30); do
            R "loginctl list-sessions --no-legend | grep -q looktest" || { LO=ok; break; }
            sleep 2
          done
          if [ $LO = ok ]; then echo "| logout | PASS | session ended |" >> report.md; else echo "| logout | FAIL | looktest session still there |" >> report.md; fi
          shot after-logout
          # Startup apps: the switched-off test app must not start at the next sign-in
          sleep 10; QM click 640 200; sleep 2; QM type $LPW; QM key ret
          for _ in $(seq 60); do R "pgrep -u looktest -x plasmashell" >/dev/null 2>&1 && break; sleep 2; done; sleep 20; shot relogin-desktop
          part taskmgr && part session && chk "Startup apps: a switched-off app does not start at sign-in" 0 "pgrep -u looktest -x plasmashell >/dev/null && { pgrep -u looktest -f 'mtm-autostart-test 99999' || echo off; }" '^off$'
          # Bulgarian: what Language & region writes (plasma-localerc [Translations] LANGUAGE), sign out and in, look at KDE-owned and
          # Mountain windows, then back to English. Only KDE's own text (Dolphin, Plasma menus) is Bulgarian: Mountain's plasmoids ship no bg catalog.
          chk "Bulgarian: KDE catalogs are installed" 0 "ls /usr/share/locale/bg/LC_MESSAGES/dolphin.mo /usr/share/locale/bg/LC_MESSAGES/plasmashell.mo" 'dolphin.mo'
          R "$LT kwriteconfig6 --file plasma-localerc --group Translations --key LANGUAGE bg:en_US"
          R "$LT dbus-send --session --type=method_call --dest=org.kde.Shutdown /Shutdown org.kde.Shutdown.logout" || true
          for _ in $(seq 30); do R "loginctl list-sessions --no-legend | grep -q looktest" || break; sleep 2; done
          sleep 10; QM click 640 200; sleep 2; QM type $LPW; QM key ret
          for _ in $(seq 60); do R "pgrep -u looktest -x plasmashell" >/dev/null 2>&1 && break; sleep 2; done; sleep 20
          R "$LT kwriteconfig6 --file plasma-localerc --group Translations --key LANGUAGE --delete" # English again for the next sign-in (this session keeps bg)
          chk "Bulgarian: the shell runs in bg" 0 "tr '\0' '\n' < /proc/\$(pgrep -u looktest -x plasmashell | head -1)/environ | grep '^LANGUAGE='" 'bg'
          QM key meta_l; sleep 3; shot bg-start-menu; QM key esc; sleep 1
          QM key meta_l a; sleep 2; shot bg-quick-settings; QM key esc; sleep 1
          QM key meta_l d; sleep 2; QM rclick $((700*W/1280)) $((300*H/800)); sleep 2; shot bg-desktop-menu; QM key esc; sleep 1
          QM key meta_l d; sleep 2; QM key alt f4; sleep 3; shot bg-dialog-shutdown; QM key esc; sleep 1
          L "/usr/libexec/mountain-settings-open home"; sleep 8; shot bg-settings-home; K -f org.mountain.settings
          K -f plasma-systemmonitor; L "plasma-systemmonitor --page-id mountain-1-processes.page"; sleep 8; shot bg-taskmanager; K -f plasma-systemmonitor
          L dolphin; sleep 8; shot bg-file-explorer; K -x dolphin
          R "ls /usr/lib64/qt6/plugins/kf6/kfileitemaction/ /usr/share/kio/servicemenus/ 2>&1" > fileitemactions-log.txt 2>&1 || true # real names of the right-click plugins (folder-colour row)
          R "$LT dbus-send --session --type=method_call --dest=org.kde.Shutdown /Shutdown org.kde.Shutdown.logout" || true; sleep 15
          fi # part session: logout, sign in again, Startup apps, Bulgarian (a quick run without it stays signed in)
          BT=$(R "systemd-analyze | head -1 | sed 's/.*= //'")
          printf '\nMETRICS\n- RAM used at desktop: %s MB\n- login-to-desktop: %s s\n- start-menu latency: %s ms\n- boot (systemd-analyze): %s\n\n' "$RAM" "$LTD" "$LAT" "$BT" >> report.md
          if part rollback; then
          # rollback: a second deployment (same image, one test kernel argument), boot it, then "Go back to the previous version"
          # v7.4 signed origin: boot with an unverified origin, as a PC installed by rebase does (set BEFORE the new deployment, which copies the origin)
          MR="ghcr.io/borisalv-marinov/$IMG"
          SIGPY="python3 -c 'import json,sys; print(json.load(sys.stdin)[\"spec\"][\"image\"].get(\"signature\",\"insecure\"))'"
          chk "signed origin: the test origin is unverified before the reboot" 0 "unshare -m sh -c 'mount -o remount,rw /sysroot && bootc switch --mutate-in-place --transport registry $MR:latest' >/dev/null 2>&1; bootc status --format=json | $SIGPY" '^insecure$'
          chk "new deployment for the rollback test" 2 "rpm-ostree kargs --append=mountain.rollbacktest=1 2>&1 | tail -2" '.'
          # v7.4 QA: five settings a user changes, checked again after the reboot below (restart survival)
          KB0=$(R "$(TL 'kreadconfig6 --file kxkbrc --group Layout --key LayoutList')" | tr -d '\r')
          R "$(TL 'kwriteconfig6 --file kscreenlockerrc --group Daemon --key Timeout 7')"
          R "$(TL '/usr/libexec/mountain-app-permissions set com.heroicgameslauncher.hgl files off')" || true
          PA off || true
          # the disk-full row below runs while VS Code is open: a full disk gives a mapped file a SIGBUS (the one crash in 3 full runs, 44717308274); close it first
          R "pkill -u looktest -x code || true"; sleep 2
          chk "attack: fill the disk" 2 "fallocate -l \$(( \$(df --output=avail -B1 /var | tail -1) - 64*1024*1024 )) /var/rt-fill; df -h /var | tail -1" '.'

          R "rm -f /etc/sddm.conf.d/zz-autologin.conf /etc/plasmalogin.conf"
          newboot() { local b; for _ in $(seq 18); do b=$(R "cat /proc/sys/kernel/random/boot_id" 2>/dev/null); [ -n "$b" ] && [ "$b" != "$1" ] && return 0; sleep 10; done; return 1; }
          for n in 1 2; do
            BID=$(R "cat /proc/sys/kernel/random/boot_id")
            R "systemctl reboot" || true; ssh $SSHO -O exit root@127.0.0.1 2>/dev/null # drop the shared connection
            sleep 30
            if wait_ssh 600 && newboot "$BID"; then chk "reboot $n failed units" 0 "systemctl --failed --no-legend | wc -l | xargs test 0 -eq && echo none" '^none$'
              if [ $n = 1 ]; then
                chk "restart keeps: screen lock timeout" 0 "$(TL 'kreadconfig6 --file kscreenlockerrc --group Daemon --key Timeout')" '^7$'
                chk "restart keeps: keyboard layouts" 0 "$(TL 'kreadconfig6 --file kxkbrc --group Layout --key LayoutList')" "^${KB0:-.}\$"
                chk "restart keeps: App permissions Files off" 0 "$(TL '/usr/libexec/mountain-app-permissions list | grep -m1 ^com.heroicgameslauncher.hgl | cut -f3')" '^off$'
                chk "restart keeps: Active Protection off (the admin switch flag)" 0 "test -e /var/lib/mountain/protect-off-\$(id -u looktest) && echo flag" '^flag$'
                chk "rollback test: new version booted, previous kept" 0 "grep -o mountain.rollbacktest=1 /proc/cmdline; rpm-ostree status --json | python3 -c 'import json,sys; print(len(json.load(sys.stdin)[\"deployments\"]), \"deployments\")'" 'mountain.rollbacktest=1'
                chk "signed origin: an unsigned origin is rewritten at boot" 0 "timeout 120 systemctl is-system-running --wait >/dev/null 2>&1; bootc status --format=json | $SIGPY" 'containerPolicy'
                chk "signed origin: rpm-ostree shows ostree-image-signed" 0 "rpm-ostree status | grep -m1 -o 'ostree-image-signed:docker://ghcr.io/borisalv-marinov/[^ ]*'" 'ostree-image-signed'
                chk "signed origin: a second run changes nothing" 0 "n0=\$(journalctl -u mountain-signed-origin -b -o cat | grep -c 'now signature-enforced'); systemctl restart mountain-signed-origin; n1=\$(journalctl -u mountain-signed-origin -b -o cat | grep -c 'now signature-enforced'); echo same-\$((n1-n0))" '^same-0$'
                chk "attack: a full disk still boots" 0 "test -e /var/rt-fill && rm -f /var/rt-fill && echo booted-full" '^booted-full$'
                chk "Go back to the previous version" 0 "/usr/libexec/mountain-security rollback 2>&1 | tail -1" 'rollback=staged'
              else
                chk "rollback works: the previous version booted" 0 "grep -q mountain.rollbacktest /proc/cmdline && echo still-new || echo previous" '^previous$'
              fi
            else echo "| reboot $n | FAIL | ssh not back |" >> report.md; fi
          done
          PA on || true
          R "$(TL '/usr/libexec/mountain-app-permissions set com.heroicgameslauncher.hgl files on')" || true
          fi # part rollback

          if part greenboot; then
          # v7.4 greenboot: a new deployment whose health check fails (the marker fails only on the test kernel argument, which only the new deployment has)
          # must roll back by itself after GREENBOOT_MAX_BOOT_ATTEMPTS failed boots. Needs the currently booted deployment to be the good one (a rollback part before it leaves it so).
          R "rm -f /etc/sddm.conf.d/zz-autologin.conf /etc/plasmalogin.conf"
          R "cp -a /etc/greenboot/greenboot.conf /root/gb.conf.orig 2>/dev/null; install -d /etc/greenboot/check/required.d && printf '#!/bin/sh\n! grep -q mountain.gbfail=1 /proc/cmdline\n' > /etc/greenboot/check/required.d/90-mt-marker.sh && chmod +x /etc/greenboot/check/required.d/90-mt-marker.sh; sed -i 's/^GREENBOOT_MAX_BOOT_ATTEMPTS=.*/GREENBOOT_MAX_BOOT_ATTEMPTS=2/' /etc/greenboot/greenboot.conf # keep its DISABLED_HEALTHCHECKS (the DNS check)" # in /etc before the new deployment is made: it gets a copy
          chk "greenboot test: new deployment with the failing marker staged" 0 "rpm-ostree kargs --append=mountain.gbfail=1 2>&1 | tail -3; rpm-ostree status --json | python3 -c 'import json,sys; print(\"staged\", any(d.get(\"staged\") for d in json.load(sys.stdin)[\"deployments\"]))'" 'staged True'
          GBID=$(R "cat /proc/sys/kernel/random/boot_id")
          R "systemctl reboot" || true; ssh $SSHO -O exit root@127.0.0.1 2>/dev/null
          # each failing boot reboots by itself; wait until a boot without the marker argument and with another boot id shows up (up to 20 min, ~6 boots)
          GBEND=$(( $(date +%s) + 1200 )); GBOK=
          while [ "$(date +%s)" -lt "$GBEND" ]; do
            o=$(R "grep -c mountain.gbfail=1 /proc/cmdline; cat /proc/sys/kernel/random/boot_id" 2>/dev/null | paste -sd' ')
            [[ $o == "0 "* && "${o#0 }" != "$GBID" ]] && { GBOK=1; break; }
            [ -z "$o" ] && ssh $SSHO -O exit root@127.0.0.1 2>/dev/null
            sleep 15
          done
          echo "greenboot wait: ok=${GBOK:-no} last=$o"
          chk "greenboot: the failed new deployment was rolled back automatically" 0 "grep -q mountain.gbfail /proc/cmdline && echo still-new || echo previous" '^previous$'
          chk "greenboot: rolled back, boot counter and status" 2 "grub2-editenv list 2>&1 | grep '^boot' | paste -sd' '; journalctl -b -u greenboot-healthcheck -o cat | tail -3" '.'
          R "rm -f /etc/greenboot/check/required.d/90-mt-marker.sh; if [ -e /root/gb.conf.orig ]; then cp -a /root/gb.conf.orig /etc/greenboot/greenboot.conf; rm -f /root/gb.conf.orig; else rm -f /etc/greenboot/greenboot.conf; fi" # the test's own marker and config go
          chk "greenboot: the test's marker is removed" 0 "test ! -e /etc/greenboot/check/required.d/90-mt-marker.sh && echo gone" '^gone$'
          fi # part greenboot
          # clean shutdown: the VM must power itself off
          R "systemctl poweroff" || true; ssh $SSHO -O exit root@127.0.0.1 2>/dev/null
          if timeout 180 sudo podman wait qemu >/dev/null 2>&1; then echo "| shutdown | PASS | VM powered off |" >> report.md
          else echo "| shutdown | FAIL | still running after 180 s |" >> report.md; CORE_FAIL=1; fi

          cat report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$CORE_FAIL" = 1 ]; then echo "::error::core check failed"; exit 1; fi
          if grep -q '| FAIL |' report.md; then echo "::error::$(grep -c '| FAIL |' report.md) check(s) failed"; exit 1; fi
      - name: User-view checks (read the screen like a person)
        if: always()
        run: |
          cd "$HOME/vm"
          python3 "$GITHUB_WORKSPACE/tests/vm/test_uxcheck.py"
          rc=0; python3 "$GITHUB_WORKSPACE/tests/vm/uxcheck.py" shots "$GITHUB_WORKSPACE/tests/vm/ux-rules.json" > ux.md || rc=$? # bash -e: keep the rows when a check fails
          cat ux.md >> report.md
          { echo; echo "## User-view checks"; echo; echo "| Check | Result | Evidence |"; echo "|---|---|---|"; cat ux.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Fix ownership
        if: always()
        run: sudo chown -R "$USER" "$HOME/vm" || true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vm-test-report
          path: |
            /home/runner/vm/report.md
            /home/runner/vm/*.png
            /home/runner/vm/shots/*.png
            /home/runner/vm/shots/*.json
            /home/runner/vm/perf/*.txt
            /home/runner/vm/*.txt
            /home/runner/vm/serial.log

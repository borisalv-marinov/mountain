          P "top -b -n 2 -d 5 | head -40" top
          sleep 60
          P "free -m; ps -eo rss,pcpu,user,comm --sort=-rss | head -40" ps2
          P "ps -eo rss,comm --no-headers | awk '{a[\$2]+=\$1; n[\$2]++} END{for(k in a) printf \"%d MB %d procs %s\n\", a[k]/1024, n[k], k}' | sort -rn | head -40" ps-grouped
          P "free -m; cat /proc/pressure/memory /proc/pressure/cpu; zramctl; cat /sys/kernel/mm/transparent_hugepage/enabled; sysctl vm.swappiness; swapon --show" mem
          P "systemctl list-unit-files --state=enabled --no-pager" unit-files-enabled
          P "systemctl list-units --type=service --state=running --no-pager" system-running
          P "$LT systemctl --user list-units --type=service --state=running --no-pager" user-running
          P "systemd-analyze; systemd-analyze blame | head -30; systemd-analyze critical-chain" boot
          P "ls -la /etc/xdg/autostart ~looktest/.config/autostart" autostart
          P "journalctl -b --no-pager | grep -i -E 'llvmpipe|renderer|kwin|softpipe|swrast|virtio_gpu|virgl' | head -60; ls /dev/dri; (glxinfo -B || eglinfo | head -40) 2>&1" gpu
          P "kreadconfig6 --file kwinrc --group Plugins --key x 2>&1; cat ~looktest/.config/kwinrc /etc/xdg/kwinrc 2>&1; $LT qdbus6 org.kde.KWin /Effects org.kde.kwin.Effects.loadedEffects 2>&1; $LT qdbus6 org.kde.KWin /KWin org.kde.KWin.supportInformation 2>&1 | head -120" kwin
          P "flatpak list --app; flatpak ps; rpm -q kdeconnect plasma-discover baloo input-remapper geoclue2 2>&1; balooctl6 status 2>&1" misc
          P "ps -eo pid,rss,pcpu,user,args --sort=-rss | head -25 | cut -c1-200" ps-args
          P "$LT systemctl --user list-unit-files --state=enabled --no-pager" user-unit-files
          
          # Security page, on-demand virus scan, firewall, Flatpak sandbox, snapshots, accounts
          U() { R "$LT systemd-run --user --wait --pipe --quiet --collect $*"; } # like an app started from the desktop
          L "/usr/libexec/mountain-settings-open privacy"; PGF=-f wchk "Security entry opens Settings on Privacy & security" 0 org.mountain.settings 20; sleep 8; shot security-page
          chk "security status" 2 "$LT systemd-run --user --wait --pipe --quiet --collect /usr/libexec/mountain-security status | paste -sd' '" '.'
          chk "Security: firewall on, SELinux enforcing" 0 "$LT systemd-run --user --wait --pipe --quiet --collect /usr/libexec/mountain-security status | grep -E '^(fw|selinux)=' | paste -sd' '" 'fw=on selinux=Enforcing'
          K -f org.mountain.settings
          R "$(TL 'mkdir -p ~/Downloads; echo WDVPIVAlQEFQWzRcUFpYNTQoUF4pN0NDKTd9JEVJQ0FSLVNUQU5EQVJELUFOVElWSVJVUy1URVNULUZJTEUhJEgrSCo= | base64 -d > ~/Downloads/eicar.com')" # the harmless EICAR test file
          SCAN=$(U /usr/libexec/mountain-security scan /home/looktest/Downloads 2>&1); echo "$SCAN" > scan-log.txt
          chk "virus definitions downloaded on Scan now (no password)" 2 "ls /var/lib/clamav | paste -sd' '" '.'
          if ! grep -q 'av_result=found' <<<"$SCAN"; then # the definitions server may refuse CI machines: test the pipeline with one test signature
            echo "| virus scan with downloaded definitions | INFO | $(grep -m1 -E 'av_result|note' <<<"$SCAN") - retrying with a test signature |" >> report.md
            R "printf '44d88612fea8a8f36de82e1278abb02f:68:Eicar-Test-Signature\n' > /var/lib/clamav/mountain-test.hdb"
            SCAN=$(U /usr/libexec/mountain-security scan /home/looktest/Downloads 2>&1); echo "$SCAN" >> scan-log.txt
          fi
          chk "virus scan finds the test file and quarantines it" 0 "test ! -e ~looktest/Downloads/eicar.com && ls ~looktest/.local/share/mountain/quarantine | grep -q eicar && echo quarantined" '^quarantined$'
          chk "virus scan cost (RAM peak, CPU)" 2 "echo '$(grep -E 'Memory peak|CPU time|runtime' <<<"$SCAN" | tr "\n'" '  ')'" '.'
          chk "nothing scans or downloads in the background" 0 "pgrep -l -x 'clamd|freshclam|clamscan|clamonacc' || echo none" '^none$'
          chk "Downloads watcher is on" 0 "$LT systemctl --user is-enabled mountain-scan-downloads.path" '^enabled$'
          R "$(TL 'echo WDVPIVAlQEFQWzRcUFpYNTQoUF4pN0NDKTd9JEVJQ0FSLVNUQU5EQVJELUFOVElWSVJVUy1URVNULUZJTEUhJEgrSCo= | base64 -d > ~/Downloads/new-download.com')"
          for _ in $(seq 40); do R "test -e ~looktest/Downloads/new-download.com" || break; sleep 3; done
          chk "a new download with a threat is quarantined automatically" 0 "test ! -e ~looktest/Downloads/new-download.com && ls ~looktest/.local/share/mountain/quarantine | grep -q new-download && echo quarantined" '^quarantined$'
          R "$(TL 'echo WDVPIVAlQEFQWzRcUFpYNTQoUF4pN0NDKTd9JEVJQ0FSLVNUQU5EQVJELUFOVElWSVJVUy1URVNULUZJTEUhJEgrSCo= | base64 -d > ~/Documents/right-click.com')"
          chk "right-click Scan with Mountain Security" 0 "$LT systemd-run --user --wait --pipe --quiet --collect /usr/libexec/mountain-security scan-notify /home/looktest/Documents/right-click.com" 'av_result=found'
          chk "quarantine restore" 0 "$LT systemd-run --user --wait --pipe --quiet --collect /usr/libexec/mountain-security quarantine-restore eicar.com && test -e ~looktest/Downloads/eicar.com && echo restored" '^restored$'
          R "rm -f ~looktest/Downloads/eicar.com"
          chk "scan history" 2 "tail -3 ~looktest/.local/share/mountain/scan-history | paste -sd';'" 'scan'
          L "/usr/libexec/mountain-settings-open privacy"; sleep 9; shot security-page-after-scans; K -f org.mountain.settings
          R "rm -f /var/lib/clamav/mountain-test.hdb"
          # firewall: a service listening on 8765 answers inside the VM but not from outside
          L "python3 -m http.server 8765 --directory /tmp"; sleep 3
          chk "test service answers inside the VM" 0 "curl -s -o /dev/null -w '%{http_code}' -m 5 http://127.0.0.1:8765/" '^200$'
          FWR=$(curl -s -o /dev/null -w '%{http_code}' -m 8 http://127.0.0.1:8765/ 2>/dev/null)
          [ "$FWR" = 000 ] && r=PASS || r=FAIL; echo "| firewall blocks an incoming port (8765 from outside) | $r | http ${FWR:-none} |" >> report.md; echo "$r firewall"
          K -f "http.server 8765"
          chk "Allow an app: Steam Remote Play listed" 0 "$LT systemd-run --user --wait --pipe --quiet --collect /usr/libexec/mountain-security status | grep '^fw_app=steam-streaming'" 'fw_app=steam-streaming:yes'
          chk "Allow an app: block and allow again" 0 "/usr/libexec/mountain-security allow rdp on; firewall-cmd --zone=mountain --query-service=rdp; /usr/libexec/mountain-security allow rdp off; firewall-cmd --zone=mountain --query-service=rdp || echo blocked-again" 'blocked-again'
          chk "network profile Home, then Public" 0 "/usr/libexec/mountain-security profile home >/dev/null; sleep 3; firewall-cmd --get-active-zones | head -1; /usr/libexec/mountain-security profile public >/dev/null; sleep 3; firewall-cmd --get-active-zones | head -1" 'mountain-home'
          chk "USB protection on keeps the plugged-in mouse, then off" 0 "/usr/libexec/mountain-usbguard on >/dev/null && usbguard list-devices | grep -c allow; /usr/libexec/mountain-usbguard off >/dev/null; systemctl is-active usbguard || true" 'inactive'
          chk "core dumps off" 0 "systemd-analyze cat-config systemd/coredump.conf | grep -E '^Storage='" 'Storage=none'
          # Restart into Windows: hidden without a Windows boot entry; with a fake one it sets a one-time boot
          chk "Restart into Windows hidden without Windows" 0 "/usr/libexec/mountain-windows-boot check || echo hidden" '^hidden$'
          R "efibootmgr --create --disk /dev/vda --part 1 --label 'Windows Boot Manager' --loader '\\EFI\\Microsoft\\Boot\\bootmgfw.efi' >/dev/null"
          WINE=$(R "/usr/libexec/mountain-windows-boot check")
          chk "Restart into Windows shown with a Windows entry" 0 "echo entry=$WINE" '^entry=[0-9A-F]{4}$'
          QM key meta_l; sleep 3; QM click $((975*W/1280)) $((700*H/800)); sleep 2; shot start-power-menu-windows; QM key esc; QM key esc
          chk "Restart into Windows sets a one-time boot" 0 "/usr/libexec/mountain-windows-boot go --no-restart; efibootmgr | grep BootNext" "BootNext: $WINE"
          R "efibootmgr --delete-bootnext >/dev/null; efibootmgr --bootnum $WINE --delete-bootnum >/dev/null" || true
          # Flatpak sandbox: a chat app can't read Documents; a game launcher keeps its access
          R "$(TL 'mkdir -p ~/Documents; echo secret > ~/Documents/private.txt')"
          chk "Flatpak sandbox: Discord can't read Documents" 0 "$LT HOME=/home/looktest flatpak run --command=cat com.discordapp.Discord /home/looktest/Documents/private.txt 2>&1 | tail -1" 'No such file'
          chk "Flatpak overrides (Discord)" 2 "cat /var/lib/flatpak/overrides/com.discordapp.Discord | paste -sd' '" '.'
          chk "Heroic (games) keeps its access" 2 "$LT HOME=/home/looktest flatpak run --command=cat com.heroicgameslauncher.hgl /home/looktest/Documents/private.txt 2>&1 | tail -1" '.'
          # snapshots: delete a file, copy it back from Previous versions
          R "$(TL 'echo precious > ~/Documents/precious.txt')"
          chk "snapshot of the home folders" 0 "systemctl start mountain-snapshot.service && ls /var/home/.snapshots | tail -1" '^[0-9]{4}-'
          SNAP=$(R "ls /var/home/.snapshots | tail -1")
          R "$(TL 'rm ~/Documents/precious.txt')"
          chk "deleted file restored from Previous versions" 0 "$(TL "cp /var/home/.snapshots/$SNAP/looktest/Documents/precious.txt ~/Documents/ && cat ~/Documents/precious.txt")" '^precious$'
          chk "snapshots are read-only for programs" 0 "$(TL "touch /var/home/.snapshots/$SNAP/looktest/x 2>/dev/null && echo writable || echo blocked")" '^blocked$'
          L "dolphin /var/home/.snapshots/$SNAP/looktest/Documents"; sleep 7; shot previous-versions; K -x dolphin
          chk "sudo always asks for a password" 0 "grep -rs NOPASSWD /etc/sudoers /etc/sudoers.d || echo none" '^none$'
          chk "polkit rules that skip the password" 2 "grep -ls 'Result.YES' /etc/polkit-1/rules.d/* /usr/share/polkit-1/rules.d/* 2>/dev/null | paste -sd' '" '.'
          chk "kernel lockdown (off by default: game drivers)" 2 "cat /sys/kernel/security/lockdown" '.'

          # 11. logout
          K -x kdebugsettings; R "$LT flatpak kill com.microsoft.Edge" || true; QM key esc
          R "lsblk -o NAME,FSTYPE,LABEL,RO,SIZE,MOUNTPOINTS; udisksctl dump" > perf/drives.txt 2>&1 || true
          chk "drives seen by udisks" 2 "lsblk -o NAME,FSTYPE,LABEL,RO,MOUNTPOINTS | tr \"\n\" \";\"; udisksctl dump | grep -E \"^/org|HintIgnore|IdType:\" | tr \"\n\" \" \" | cut -c1-600" '.'
          R "$LT dbus-send --session --type=method_call --dest=org.kde.Shutdown /Shutdown org.kde.Shutdown.logout" || true
          LO=fail
          for _ in $(seq 30); do
            R "loginctl list-sessions --no-legend | grep -q looktest" || { LO=ok; break; }
            sleep 2
          done
          if [ $LO = ok ]; then echo "| logout | PASS | session ended |" >> report.md; else echo "| logout | FAIL | looktest session still there |" >> report.md; fi
          shot after-logout
          # Startup apps: the switched-off test app must not start at the next sign-in
          sleep 10; QM click 640 200; sleep 2; QM type $LPW; QM key ret
          for _ in $(seq 60); do R "pgrep -u looktest -x plasmashell" >/dev/null 2>&1 && break; sleep 2; done; sleep 20; shot relogin-desktop
          chk "Startup apps: a switched-off app does not start at sign-in" 0 "pgrep -u looktest -f 'mtm-autostart-test 99999' || echo off" '^off$'
          R "$LT dbus-send --session --type=method_call --dest=org.kde.Shutdown /Shutdown org.kde.Shutdown.logout" || true; sleep 15
          # rollback: a second deployment (same image, one test kernel argument), boot it, then "Go back to the previous version"
          chk "new deployment for the rollback test" 2 "rpm-ostree kargs --append=mountain.rollbacktest=1 2>&1 | tail -2" '.'
          BT=$(R "systemd-analyze | head -1 | sed 's/.*= //'")
          printf '\nMETRICS\n- RAM used at desktop: %s MB\n- login-to-desktop: %s s\n- start-menu latency: %s ms\n- boot (systemd-analyze): %s\n\n' "$RAM" "$LTD" "$LAT" "$BT" >> report.md

          R "rm -f /etc/sddm.conf.d/zz-autologin.conf /etc/plasmalogin.conf"
          for n in 1 2; do
            R "systemctl reboot" || true; ssh $SSHO -O exit root@127.0.0.1 2>/dev/null # drop the shared connection
            sleep 30
            if wait_ssh 600; then chk "reboot $n failed units" 0 "systemctl --failed --no-legend | wc -l | xargs test 0 -eq && echo none" '^none$'
              if [ $n = 1 ]; then
                chk "rollback test: new version booted, previous kept" 0 "grep -o mountain.rollbacktest=1 /proc/cmdline; rpm-ostree status --json | python3 -c 'import json,sys; print(len(json.load(sys.stdin)[\"deployments\"]), \"deployments\")'" 'mountain.rollbacktest=1'
                chk "Go back to the previous version" 0 "/usr/libexec/mountain-security rollback 2>&1 | tail -1" 'rollback=staged'
              else
                chk "rollback works: the previous version booted" 0 "grep -q mountain.rollbacktest /proc/cmdline && echo still-new || echo previous" '^previous$'
              fi
            else echo "| reboot $n | FAIL | ssh not back |" >> report.md; fi
          done
          # clean shutdown: the VM must power itself off
          R "systemctl poweroff" || true; ssh $SSHO -O exit root@127.0.0.1 2>/dev/null
          if timeout 180 sudo podman wait qemu >/dev/null 2>&1; then echo "| shutdown | PASS | VM powered off |" >> report.md
          else echo "| shutdown | FAIL | still running after 180 s |" >> report.md; CORE_FAIL=1; fi

          cat report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$CORE_FAIL" = 1 ]; then echo "::error::core check failed"; exit 1; fi
      - name: Fix ownership
        if: always()
        run: sudo chown -R "$USER" "$HOME/vm" || true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-test-report
          path: |
            /home/runner/vm/report.md
            /home/runner/vm/*.png
            /home/runner/vm/shots/*.png
            /home/runner/vm/perf/*.txt
            /home/runner/vm/*.txt
            /home/runner/vm/serial.log

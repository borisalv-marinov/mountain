name: vm-test
run-name: "vm-test${{ inputs.parts && format(' (quick: {0})', inputs.parts) || (github.event_name == 'schedule' && ' (security suite)') || '' }}"
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to test (empty: newest build of this branch)"
        default: ""
        type: string
      parts:
        description: "Quick re-check: only these parts (gui apps taskmgr security attack hardware startapps session rollback greenboot, space-separated). Empty: everything. A quick run never counts for a merge"
        default: ""
        type: string
  workflow_run: # every successful image build of main (nightlies too) and of the release branch
    workflows: [bluebuild]
    types: [completed]
    branches: [main, mountain-v6]
  schedule: # nightly security suite (runs from the default branch only)
    - cron: "30 1 * * *"

jobs:
  vm:
    name: Boot image in VM
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04 # 26.04 denies bib mounts
    timeout-minutes: 220 # v7.4 security rows add ~30 min (greenboot reboots); ~85 min of checks + up to ~25 min of test-only hardware installs (hwsim.sh) + ~25 min opening every Start app
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: [mountain] # NVIDIA can't be tested without a GPU
    env:
      IMG: ${{ matrix.image }}
      BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      PARTS: ${{ inputs.parts || (github.event_name == 'schedule' && 'security attack rollback greenboot') || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 # tests/vm: user-view checks (OCR, window census, every Start app)
        with:
          sparse-checkout: tests/vm
      - name: Enable KVM and install tools
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          # Azure apt mirror outages break installs; use the main Ubuntu mirror with retries.
          echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          echo "Acquire::Retries \"5\";" | sudo tee /etc/apt/apt.conf.d/80retries
          # Ubuntu's archive can stall (19 Nov: 25 min at 20 kB/s, every run died here): short timeouts, retries per file, 3 tries in all
          # a second network path when archive.ubuntu.com is unreachable from GitHub (runs 44522177035/44522190741)
          printf 'http://azure.archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://mirrors.edge.kernel.org/ubuntu/\tpriority:2\nhttp://archive.ubuntu.com/ubuntu/\tpriority:3\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          echo 'Acquire::Retries "5"; Acquire::ForceIPv4 "true"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-mountain-retries >/dev/null
          ok=; for i in 1 2 3; do sudo apt-get update && sudo apt-get install -y qemu-utils imagemagick socat skopeo tesseract-ocr tesseract-ocr-bul python3-pil && { ok=1; break; }; sleep 30; done; [ "$ok" = 1 ]
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Generate ephemeral credentials
        run: |
          mkdir -p "$HOME/vm" && cd "$HOME/vm"
          ssh-keygen -t ed25519 -N "" -f key -q
          PW=$(openssl rand -hex 12)
          echo "::add-mask::$PW"
          echo "TESTPW=$PW" >> "$GITHUB_ENV"

      - name: Find image tag
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [ -n "$TAG" ] && { echo "tag=$TAG" >> "$GITHUB_OUTPUT"; echo "Using tag: $TAG"; exit 0; }
          SAFE="${BRANCH//\//_}" # BlueBuild tags a branch with a slash as br-<a>_<b>-<ver>
          # main builds are tagged "latest", branch builds "br-<branch>-<ver>"
          if [ "$BRANCH" = main ]; then echo "tag=latest" >> "$GITHUB_OUTPUT"; echo "Using tag: latest"; exit 0; fi
          ALL=$(skopeo list-tags "docker://ghcr.io/borisalv-marinov/$IMG" | jq -r '.Tags[]')
          TAG=$(echo "$ALL" | grep -F -- "br-$SAFE-" | sort -V | tail -n 1 || true)
          [ -n "$TAG" ] || { echo "::error::no tag contains $SAFE"; echo "$ALL"; exit 1; }
          echo "Using tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build qcow2 with bootc-image-builder
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          cd "$HOME/vm"
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          REF="ghcr.io/borisalv-marinov/$IMG:$TAG"
          # test-only derived image: enable sshd + key auth (the shipped image stays untouched)
          cat > Containerfile <<EOF
          FROM $REF
          COPY key.pub /etc/ssh/authorized_keys.d/root
          COPY key.pub /etc/ssh/authorized_keys.d/tester
          RUN systemctl enable sshd \
           && firewall-offline-cmd --zone=mountain --add-service=ssh \
           && chmod 755 /etc/ssh/authorized_keys.d && chmod 644 /etc/ssh/authorized_keys.d/* \
           && printf 'AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys.d/%%u\nPermitRootLogin prohibit-password\n' > /etc/ssh/sshd_config.d/90-test.conf
          EOF
          sudo podman build -t localhost/mountain-test:latest .
          {
            echo '[[customizations.user]]'
            echo 'name = "tester"'
            echo "password = \"$TESTPW\""
            echo "key = \"$(cat key.pub)\""
            echo 'groups = ["wheel"]'
            echo '[[customizations.filesystem]]'
            echo 'mountpoint = "/"'
            echo 'minsize = "40 GiB"' # first-boot apps filled the default-size root ("Low Disk Space")
          } > config.toml
          mkdir -p output
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t --security-opt apparmor=unconfined \
            -v "$PWD/config.toml:/config.toml:ro" \
            -v "$PWD/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 --rootfs btrfs --local localhost/mountain-test:latest
          sudo chown -R "$USER" output
          mv output/qcow2/disk.qcow2 disk.qcow2
          sudo podman rmi -af >/dev/null 2>&1 || true
          qemu-img resize disk.qcow2 64G
          df -h /

      - name: Boot VM
        run: |
          cd "$HOME/vm"
          cat > qemu.sh <<'QS'
          #!/bin/bash
          set -e
          dnf -y -q install qemu-kvm edk2-ovmf >/vm/dnf.log 2>&1
          dnf -y -q install qemu-device-display-virtio-gpu qemu-device-display-virtio-vga >>/vm/dnf.log 2>&1 || true
          D=/usr/share/edk2/ovmf
          for p in OVMF_CODE_4M.fd:OVMF_VARS_4M.fd OVMF_CODE.fd:OVMF_VARS.fd; do
            [ -e "$D/${p%:*}" ] && [ -e "$D/${p##*:}" ] && { CODE="$D/${p%:*}"; cp "$D/${p##*:}" /vm/vars.fd; break; }
          done
          [ -n "$CODE" ] || { ls -R /usr/share/edk2 >>/vm/dnf.log; exit 1; }
          exec qemu-system-x86_64 -enable-kvm -cpu host -m 6144 -smp 4 -machine q35             -drive if=pflash,format=raw,readonly=on,file="$CODE"             -drive if=pflash,format=raw,file=/vm/vars.fd             -drive file=/vm/disk.qcow2,if=virtio             -nic user,model=virtio-net-pci,hostfwd=tcp:127.0.0.1:2222-:22,hostfwd=tcp:127.0.0.1:8765-:8765             -device virtio-vga,xres=1280,yres=800 -display none             -device qemu-xhci -device usb-tablet             -audiodev none,id=a0 -device intel-hda -device hda-duplex,audiodev=a0             -monitor unix:/tmp/qmon,server,nowait -qmp unix:/tmp/qmp,server,nowait -serial file:/vm/serial.log
          QS
          date +%s > boot_start
          sudo podman run -d --name qemu --privileged --network host --device /dev/kvm -v "$HOME/vm:/vm" -v /tmp:/tmp quay.io/fedora/fedora:latest bash /vm/qemu.sh
          for _ in $(seq 450); do [ -e /tmp/qmon ] && break; sleep 2; done # dnf in the container can be slow on a bad mirror
          [ -e /tmp/qmon ] || { sudo podman logs qemu; tail -30 dnf.log; echo "::error::qemu did not start"; exit 1; }

      - name: Run tests
        run: |
          cd "$HOME/vm"
          SSHO="-i $PWD/key -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=8 -o BatchMode=yes -o ControlMaster=auto -o ControlPath=/tmp/vmssh-%C -o ControlPersist=120"
          set +e # a failing check must not abort the run
          R() { ssh $SSHO root@127.0.0.1 "$@"; } # everything runs as root over ssh
          TU() { printf 'sudo -u tester -i bash -c %q' "$1"; } # wrap a command to run as tester
          wait_ssh() {
            local end=$(( $(date +%s) + $1 ))
            while [ "$(date +%s)" -lt "$end" ]; do R true 2>/dev/null && return 0; sleep 10; done
            return 1
          }
          printf '# VM test report (%s)\n\n| Check | Result | Evidence |\n|---|---|---|\n' "$IMG" > report.md
          CORE_FAIL=0
          chk() { # name core(0/1, 2=INFO only) cmd expected-regex
            local out rc ev r
            for _ in 1 2 3; do out=$(R "$3" 2>&1); rc=$?; [ $rc -ne 255 ] && break; sleep 10; done
            echo "$out" | grep -Eq -- "$4" || rc=1
            ev=$(echo "$out" | head -3 | tr '\n|' ' /' | cut -c1-80)
            if [ "$2" = 2 ]; then r=INFO
            elif [ $rc -eq 0 ]; then r=PASS
            else r=FAIL; [ "$2" = 1 ] && CORE_FAIL=1; fi
            echo "| $1 | $r | \`$ev\` |" >> report.md
            echo "$r $1"
          }
          # quick re-check (input parts): run only the named parts; setup, perf data, the stability rows and the shutdown always run
          part() { [ -z "${PARTS// }" ] || [[ " $PARTS " == *" $1 "* ]]; }
          for p in $PARTS; do case $p in gui|apps|taskmgr|security|attack|hardware|startapps|redraw|session|rollback|greenboot) ;; *) echo "::error::unknown part $p"; exit 1 ;; esac; done
          [ -z "${PARTS// }" ] || { [ "$GITHUB_EVENT_NAME" = schedule ] && QL="security suite" || QL="quick run"; echo "| $QL: only $PARTS (never counts for a merge) | INFO | other parts skipped |" >> report.md; }

          if ! wait_ssh 600; then
            echo "| SSH up within 10 min | FAIL | never came up |" >> report.md
            sudo tail -50 serial.log >> report.md || true
            cat report.md >> "$GITHUB_STEP_SUMMARY"
            echo "::error::SSH never came up"; exit 1
          fi
          BOOT=$(( $(date +%s) - $(cat boot_start) ))
          sleep 30 # sshd accepts before the system settles; first checks were reset
          echo "| SSH up | PASS | ${BOOT}s after qemu start |" >> report.md
          # this VM only (in /run, gone at the next boot): a crashing program logs its stack trace (function names from Fedora's
          # MiniDebugInfo), still never stored (the image's Storage=none stays); set before the first sign-in starts the user manager
          R "mkdir -p /run/systemd/coredump.conf.d /run/systemd/system/user@.service.d /run/systemd/user.conf.d && printf '[Coredump]\nProcessSizeMax=2G\n' > /run/systemd/coredump.conf.d/90-vmtest.conf && printf '[Service]\nLimitCORE=infinity\n' > /run/systemd/system/user@.service.d/90-vmtest-core.conf && printf '[Manager]\nDefaultLimitCORE=infinity\n' > /run/systemd/user.conf.d/90-vmtest-core.conf && systemctl daemon-reload" || true
          # bib's config.toml user was not created, so make it (gets /etc/skel)
          R "id tester >/dev/null 2>&1 || useradd -m -G wheel tester"
          # the installer makes /var/home a Btrfs subvolume (Previous versions need it); bootc-image-builder does not, so do it here
          # wait for boot to settle first: moving /var/home while first-boot jobs write into it failed silently (no snapshots)
          R "timeout 300 systemctl is-system-running --wait >/dev/null 2>&1; true"
          # as its own unit on the VM: a dropped ssh connection ("Connection reset by peer") once cut the move off halfway
          for _ in 1 2 3; do R "btrfs subvolume show /var/home >/dev/null 2>&1 || systemctl -q is-active mt-homesv || systemd-run --quiet --unit=mt-homesv bash -c 'mv /var/home /var/home.old && btrfs subvolume create /var/home && cp -a /var/home.old/. /var/home/ && rm -rf /var/home.old && restorecon -R /var/home'" && break; sleep 10; done
          for _ in $(seq 150); do R "! systemctl -q is-active mt-homesv" && break; sleep 2; done
          chk "/var/home is a Btrfs subvolume (Previous versions need it)" 1 "stat -c %i /var/home" '^256$'

          chk "os-release" 1 "grep PRETTY_NAME /etc/os-release" 'Mountain \(based on Bazzite\)'
          chk "hostname" 0 "hostname" '^mountain$'
          chk "mountain config" 1 "cat /usr/share/mountain/config" 'MOUNTAIN_NAME="Mountain"'
          chk "bootc status" 0 "bootc status 2>&1 | head -8" 'kind: BootcHost'
          chk "rpm code python3 git" 1 "rpm -q --qf '%{NAME}\n' code python3 git | grep -cE '^(code|python3|git)\$'" '^3$'
          chk "hello.py (tester)" 1 "$(TU 'python3 ~/Projects/hello.py')" 'hello'
          chk "free -m (no desktop)" 0 "free -m" 'Mem:'
          chk "failed units" 0 "systemctl --failed --no-legend | wc -l | xargs test 0 -eq && echo none" '^none$'
          chk "journal errors" 2 "journalctl -p err -b --no-pager | tail -20" '.'
          chk "systemd-analyze" 0 "systemd-analyze" 'Startup finished'
          chk "sysctl net" 0 "sysctl net.ipv4.tcp_congestion_control net.core.default_qdisc" 'tcp_congestion_control = bbr'
          chk "uupd.timer off (no background updates)" 0 "systemctl is-enabled uupd.timer 2>&1; true" 'disabled|masked|not-found|No such file'
          chk "no fetching timers" 0 "systemctl list-timers --no-legend | grep -Ec 'uupd|dnf-makecache|countme|freshclam|flatpak-(system|user)-update|ublue|bazzite' || true" '^0$'
          chk "gpu-check no bootc at boot" 0 "pgrep -f '[b]ootc switch' || echo none" '^none$'
          chk "gpu-check dry-run" 0 "/usr/libexec/mountain-gpu-check --dry-run" 'nothing to do|would switch|already switched'
          chk "skel Desktop (tester)" 0 "$(TU 'ls ~/Desktop')" 'Browsers'
          chk "Kvantum BlackGlass" 0 "$(TU 'grep -rh BlackGlass /etc/xdg/Kvantum ~/.config/Kvantum 2>/dev/null')" 'theme=BlackGlass'
          chk "kdeglobals style" 0 "grep -h widgetStyle /etc/xdg/kdeglobals" 'widgetStyle=kvantum'
          chk "mountain launchers" 0 "ls /usr/share/applications/mountain-*.desktop | wc -l" '^([3-9]|[1-9][0-9])$'
          chk "steam" 0 "command -v steam" 'steam'  # gamemode is removed upstream on purpose
          chk "ping 1.1.1.1 (QEMU user net: no ICMP)" 2 "ping -c3 1.1.1.1 | tail -2" '.'
          chk "geforcenow reachable" 0 "curl -sI https://play.geforcenow.com | head -1" 'HTTP/[0-9.]+ (200|30[0-9])'

          # first-boot flatpaks, up to 25 min
          FP="dev.vencord.Vesktop com.discordapp.Discord com.microsoft.Edge com.brave.Browser org.onlyoffice.desktopeditors com.heroicgameslauncher.hgl org.mozilla.firefox"
          M=x
          FPEND=$(( $(date +%s) + 1500 ))
          while [ "$(date +%s)" -lt "$FPEND" ]; do
            L=$(R "flatpak list --app --columns=application" 2>/dev/null)
            M=""; for a in $FP; do echo "$L" | grep -qx "$a" || M="$M $a"; done
            [ -z "$M" ] && break; sleep 15
          done
          if [ -z "$M" ]; then echo "| flatpaks | PASS | all 7 present |" >> report.md
          else echo "| flatpaks | FAIL | missing:$M |" >> report.md; fi

          # desktop: autologin a fresh user, then exercise real use
          SESS=$(R "ls /usr/share/wayland-sessions | grep -i plasma | head -1")
          echo "session file: $SESS"
          LT='sudo -u looktest env XDG_RUNTIME_DIR=/run/user/$(id -u looktest) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u looktest)/bus'
          TL() { printf 'sudo -u looktest -i bash -c %q' "$1"; } # wrap a command to run as looktest
          Q() { sudo socat - UNIX-CONNECT:/tmp/qmon; }
          mkdir -p shots; SN=0
          trap 'echo "::warning::got SIGTERM during: $STEP"' TERM
          shot() { # NAME: screendump -> shots/NN-NAME.png
            STEP=$1; echo "step: $1"
            SN=$((SN+1)); echo "screendump /tmp/$1.ppm" | Q >/dev/null; sleep 2
            # a turned-off screen ("Display output is not active", near-black) after long steps with no input: one Shift wakes it
            if [ "$(sudo cat /tmp/$1.ppm | convert - -format '%[fx:mean<0.03]' info: 2>/dev/null)" = 1 ]; then
              QM key shift_r; sleep 4; echo "screendump /tmp/$1.ppm" | Q >/dev/null; sleep 2
            fi
            sudo cat /tmp/$1.ppm | convert - "$(printf 'shots/%02d-%s.png' $SN "$1")" || true
          }
          cat > qmp.py <<'PY'
          import json, os, socket, sys, time
          s = socket.socket(socket.AF_UNIX); s.connect('/tmp/qmp'); f = s.makefile('rw')
          f.readline()
          def cmd(c, a=None):
              f.write(json.dumps({'execute': c, 'arguments': a} if a else {'execute': c}) + '\n'); f.flush()
              while True:
                  r = json.loads(f.readline())
                  if 'return' in r or 'error' in r: return r
          def ev(*e): cmd('input-send-event', {'events': list(e)})
          def key(k, d): return {'type': 'key', 'data': {'down': d, 'key': {'type': 'qcode', 'data': k}}}
          def press(ks):
              ev(*[key(k, True) for k in ks]); ev(*[key(k, False) for k in reversed(ks)])
          W, H = int(os.environ.get('W', 1280)), int(os.environ.get('H', 800))
          def move(x, y):
              ev({'type': 'abs', 'data': {'axis': 'x', 'value': int(x * 32767 / W)}}, {'type': 'abs', 'data': {'axis': 'y', 'value': int(y * 32767 / H)}})
          def btn(d): ev({'type': 'btn', 'data': {'down': d, 'button': 'left'}})
          def frame(ign=0):  # md5 of a screendump without the bottom IGN rows (taskbar: clock, launch feedback)
              import hashlib
              cmd('screendump', {'filename': '/tmp/qm.ppm'}); d = open('/tmp/qm.ppm', 'rb').read()
              h = d.split(b'\n', 3); w = int(h[1].split()[0]); body = h[3]
              return hashlib.md5(body[:len(body) - ign * w * 3]).digest()
          def click(x, y): move(x, y); time.sleep(0.1); btn(True); time.sleep(0.05); btn(False)
          cmd('qmp_capabilities')
          a = sys.argv[1:]
          if a[0] == 'key': press(a[1:])
          elif a[0] == 'type':
              names = {' ': 'spc', '.': 'dot', '-': 'minus', '/': 'slash', '~': ['shift', 'grave_accent'], '_': ['shift', 'minus']}
              for c in ' '.join(a[1:]):
                  k = names.get(c, ['shift', c.lower()] if c.isupper() else c.lower())
                  press(k if isinstance(k, list) else [k]); time.sleep(0.05)
          elif a[0] == 'click': click(int(a[1]), int(a[2]))
          elif a[0] == 'dclick': click(int(a[1]), int(a[2])); time.sleep(0.12); click(int(a[1]), int(a[2]))
          elif a[0] == 'drag':
              x1, y1, x2, y2 = map(int, a[1:5]); move(x1, y1); time.sleep(0.2); btn(True); time.sleep(0.2)
              for i in range(1, 11): move(x1 + (x2 - x1) * i / 10, y1 + (y2 - y1) * i / 10); time.sleep(0.1)
              time.sleep(0.2); btn(False)
          elif a[0] == 'hold':  # press at x1 y1, move to x2 y2 and keep the button down (release with 'up')
              x1, y1, x2, y2 = map(int, a[1:5]); move(x1, y1); time.sleep(0.2); btn(True); time.sleep(0.2)
              for i in range(1, 11): move(x1 + (x2 - x1) * i / 10, y1 + (y2 - y1) * i / 10); time.sleep(0.1)
          elif a[0] == 'up': btn(False)
          elif a[0] == 'move': move(int(a[1]), int(a[2]))  # X Y: hover (tooltips, previews)
          elif a[0] == 'rclick':  # X Y: right click (context menus)
              move(int(a[1]), int(a[2])); time.sleep(0.1); ev({'type': 'btn', 'data': {'down': True, 'button': 'right'}}); time.sleep(0.05); ev({'type': 'btn', 'data': {'down': False, 'button': 'right'}})
          elif a[0] == 'keyhold':  # SECS K..: press keys, keep them down SECS, release (Alt+Tab switcher stays open for a shot)
              ks = a[2:]; ev(*[key(k, True) for k in ks]); time.sleep(float(a[1])); ev(*[key(k, False) for k in reversed(ks)])
          elif a[0] == 'fdrag':  # select an icon, then drag it at once (no pause) and keep the button down
              x1, y1, x2, y2 = map(int, a[1:5]); click(x1, y1); time.sleep(0.05); btn(True)
              for i in range(1, 6): move(x1 + (x2 - x1) * i / 5, y1 + (y2 - y1) * i / 5); time.sleep(0.03)
          elif a[0] == 'measure':  # IGNORE_BOTTOM_PX TIMEOUT_MS key K.. | dclick X Y: ms from the input to the first changed frame, and until frames settle
              ign, tmo, act = int(a[1]), int(a[2]) / 1000, a[3:]
              if act[0] == 'dclick': move(int(act[1]), int(act[2])); time.sleep(0.4)
              prev = frame(ign); t0 = time.monotonic(); first = last = None
              if act[0] == 'key': press(act[1:])
              else: btn(True); btn(False); time.sleep(0.1); btn(True); btn(False)
              while time.monotonic() - t0 < tmo:
                  fr = frame(ign); t = time.monotonic() - t0
                  if fr != prev: last = t; first = first or t; prev = fr
                  elif first and t - last > 0.4: break
              print('first=%d settle=%d' % (first * 1000 if first else -1, last * 1000 if last else -1))
          elif a[0] == 'dragfps':  # X1 Y1 X2 Y2 SECONDS: drag a title bar, count distinct frames seen per second (limited by screendump speed)
              x1, y1, x2, y2 = map(int, a[1:5]); dur = float(a[5]); move(x1, y1); time.sleep(0.2); btn(True); time.sleep(0.2)
              n = seen = 0; prev = None; t0 = time.monotonic()
              while time.monotonic() - t0 < dur:
                  k = (time.monotonic() - t0) / dur; move(x1 + (x2 - x1) * k, y1 + (y2 - y1) * k)
                  fr = frame(); seen += 1; n += fr != prev; prev = fr
              btn(False); print('frames=%d samples=%d fps=%.1f' % (n, seen, n / dur))
          PY
          QM() { sudo env W=$W H=$H python3 "$HOME/vm/qmp.py" "$@"; }
          waitproc() { # NAME SECS (PGF=-f for a pattern): seconds taken or fail
            local t0=$(date +%s) end=$(( $(date +%s) + $2 ))
            while [ "$(date +%s)" -lt "$end" ]; do
              R "pgrep -u looktest ${PGF:--x} '$1'" >/dev/null 2>&1 && { echo "$(( $(date +%s) - t0 ))s"; return 0; }
              sleep 1
            done
            return 1
          }
          wchk() { # name core proc secs
            local t r; t=$(waitproc "$3" "$4") && { echo "| $1 | PASS | $3 up in $t |" >> report.md; echo "PASS $1"; } \
              || { r=FAIL; [ "$2" = 2 ] && r=INFO; echo "| $1 | $r | $3 not running after $4 s |" >> report.md; echo "$r $1"; [ "$2" = 1 ] && CORE_FAIL=1; }
          }
          L() { R "$LT systemd-run --user --quiet --collect $*"; } # start like the app menu does: with the full session environment
          K() { R "pkill -u looktest $*" || true; sleep 1; }
          # Active Protection is RefuseManualStop + a root flag: on/off go through the root helper (what pkexec runs after the admin password)
          PA() { R "PKEXEC_UID=\$(id -u looktest) /usr/libexec/mountain-protect-admin $1"; }
          PAOFF() { PA off; local st; for _ in $(seq 25); do st=$(R "$LT systemctl --user is-active mountain-protect.service"); case $st in active|activating) sleep 2 ;; *) return 0 ;; esac; done; return 1; } # the killed watcher shows activating until its restart hits the flag (~30 s)
          # close like a person: KWin closes the windows of pid $1 (the X button), so the app ends its helpers in order; TERM only if it is still there after 15 s
          XC() { R "printf \"for (const w of workspace.windowList()) if (w.pid === %s) w.closeWindow();\n\" $1 > /tmp/wclose.js && chmod 644 /tmp/wclose.js && i=\$($LT dbus-send --session --print-reply --dest=org.kde.KWin /Scripting org.kde.kwin.Scripting.loadScript string:/tmp/wclose.js string:mountain-wclose | awk '/int32/{print \$2}') && $LT dbus-send --session --print-reply --dest=org.kde.KWin /Scripting/Script\$i org.kde.kwin.Script.run >/dev/null; for _ in \$(seq 15); do kill -0 $1 2>/dev/null || break; sleep 1; done; kill -0 $1 2>/dev/null && kill -TERM $1; for _ in \$(seq 10); do kill -0 $1 2>/dev/null || break; sleep 1; done; $LT dbus-send --session --print-reply --dest=org.kde.KWin /Scripting org.kde.kwin.Scripting.unloadScript string:mountain-wclose >/dev/null" >/dev/null 2>&1 || true; }
          # yellow folder icons on the screen, found by colour (desktop icon size and spacing may change): "column row x y width"
          cat > /tmp/icons.py <<'PY'
          import sys
          d = open(sys.argv[1], 'rb').read(); hdr = d.split(b'\n', 3); w, h = map(int, hdr[1].split()); px = hdr[3]
          def yel(x, y):
              i = (y * w + x) * 3; r, g, b = px[i], px[i + 1], px[i + 2]
              return r > 225 and 170 < g < 235 and 40 < b < 150
          top, bot, right = h * 30 // 800, h * 745 // 800, w * 420 // 1280  # below the top bar, above the taskbar, left part
          xs = [x for x in range(right) if sum(yel(x, y) for y in range(top, bot, 2)) >= 4]
          cols = []
          for x in xs:
              if cols and x - cols[-1][-1] <= 3: cols[-1].append(x)
              else: cols.append([x])
          for c, cx in enumerate([c for c in cols if len(c) >= 20], 1):
              ys = [y for y in range(top, bot) if sum(yel(x, y) for x in range(cx[0], cx[-1] + 1, 2)) >= 4]
              rows = []
              for y in ys:
                  if rows and y - rows[-1][-1] <= 3: rows[-1].append(y)
                  else: rows.append([y])
              for r, ry in enumerate([r for r in rows if len(r) >= 15], 1):
                  ym = (ry[0] + ry[-1]) // 2; xl = [x for x in range(cx[0], cx[-1] + 1) if yel(x, ym)]
                  print(c, r, (xl[0] + xl[-1]) // 2, ym, xl[-1] - xl[0] + 1)
          PY
          icon() { # COLUMN ROW -> "x y" of that yellow folder icon
            echo "screendump /tmp/icons.ppm" | Q >/dev/null
            sudo python3 /tmp/icons.py /tmp/icons.ppm | awk -v c="$1" -v r="$2" '$1==c && $2==r {print $3, $4, $5; exit}'
          }
          latency() { # ms until the screen changes after the Windows key
            local m0 m t0 t
            echo "screendump /tmp/lat.ppm" | Q >/dev/null; m0=$(sudo md5sum < /tmp/lat.ppm)
            t0=$(date +%s%N); QM key meta_l
            while :; do
              t=$(( ( $(date +%s%N) - t0 ) / 1000000 ))
              echo "screendump /tmp/lat.ppm" | Q >/dev/null; m=$(sudo md5sum < /tmp/lat.ppm)
              [ "$m" != "$m0" ] && break
              [ $t -ge 5000 ] && break
              sleep 0.1
            done
            echo $t; QM key esc; sleep 1
          }

          # 1. lock screen at start: no autologin, like the shipped image and Try Mountain
          LPW=glasstest2026
          R "userdel tester; useradd -m -c 'Look Test' looktest; echo looktest:$LPW | chpasswd; install -d -o looktest -g looktest ~looktest/.config ~looktest/.config/autostart ~looktest/.local ~looktest/.local/bin; cp /usr/bin/sleep ~looktest/.local/bin/mtm-autostart-test; printf '[Desktop Entry]\nType=Application\nName=Startup test\nExec=/home/looktest/.local/bin/mtm-autostart-test 99999\n' > ~looktest/.config/autostart/mtm-autostart-test.desktop; chown -R looktest: ~looktest/.config ~looktest/.local; systemctl restart display-manager" # one account on the sign-in screen, like a fresh PC
          sleep 30; W=1280; H=800; shot login-lock # clock and date only
          QM click 640 200; sleep 2; shot login-hello # "Hello, <name>", picture, password box
          QM move $((W-58)) $((H-58)); sleep 3; shot login-power-tooltip # review crop: bottom right, tooltip corners over the wallpaper
          QM click $((W-58)) $((H-58)); sleep 2; shot login-power-menu # Windows: power at the bottom right (Sleep, Restart, Shut down)
          QM key esc; sleep 1; QM click 640 200; sleep 1
          QM type wrongpass; QM key ret; sleep 5; shot login-wrong
          QM type $LPW; QM key ret
          LT0=$(date +%s); LTD="never"
          while [ $(( $(date +%s) - LT0 )) -lt 240 ]; do
            R "$LT dbus-send --session --print-reply --dest=org.freedesktop.DBus / org.freedesktop.DBus.NameHasOwner string:org.kde.plasmashell" 2>/dev/null | grep -q "boolean true" && { LTD=$(( $(date +%s) - LT0 )); break; }
            sleep 2
          done
          echo "| login-to-desktop | INFO | ${LTD}s |" >> report.md
          sleep 20
          shot desktop
          read W H < <(identify -format '%w %h' "$(ls shots/*-desktop.png)"); export W H
          # window census: every window that appears from here on, with its kind and look (tests/vm/census.js -> MWC| journal lines)
          R "cat > /tmp/census.js; chmod 644 /tmp/census.js" < "$GITHUB_WORKSPACE/tests/vm/census.js"
          CS=$(R "$LT dbus-send --session --print-reply --dest=org.kde.KWin /Scripting org.kde.kwin.Scripting.loadScript string:/tmp/census.js string:mountain-census" | awk '/int32/{print $2}')
          R "$LT dbus-send --session --print-reply --dest=org.kde.KWin /Scripting/Script$CS org.kde.kwin.Script.run" >/dev/null
          PS0=$(R "echo \$(pgrep -u looktest -x plasmashell),\$(pgrep -u looktest -x kwin_wayland)") # no silent restarts allowed
          echo "session pids: $PS0"
          chk "taskbar empty space is Mountain's (right-click = Task Manager)" 0 "grep -c 'plugin=org.mountain.taskbarspace' ~looktest/.config/plasma-org.kde.plasma.desktop-appletsrc" '^[1-9]'
          chk "looktest session running" 0 "loginctl list-sessions --no-legend | grep looktest" 'looktest'
          RAM=$(R "free -m | awk '/Mem:/{print \$3}'")
          chk "RAM used (desktop)" 0 "free -m | awk '/Mem:/{print \$3\" MB used\"}'" 'MB used'
          chk "autostart entries" 2 "ls /etc/xdg/autostart ~looktest/.config/autostart 2>&1" '.'
          chk "wpctl status (looktest)" 0 "$LT wpctl status | head -15" "^PipeWire '"
          chk "dolphin installed" 0 "command -v dolphin" 'dolphin'
          chk "wallet stays on for a password login" 0 "grep -qs Enabled=false ~looktest/.config/kwalletrc || echo on" '^on$'
          # 1b. Win+L locks (clock only), a click shows "Hello, <name>", the password unlocks
          SS="$LT dbus-send --session --print-reply --dest=org.freedesktop.ScreenSaver /ScreenSaver org.freedesktop.ScreenSaver.GetActive"
          QM key meta_l l; sleep 6; shot lock-screen
          chk "Win+L locks the screen" 1 "$SS" 'boolean true'
          chk "lock screen greeter runs" 0 "pgrep -u looktest -f kscreenlocker_greet" '^[0-9]+'
          chk "greeter QML has no errors" 0 "journalctl -b --no-pager | grep -E 'kscreenlocker_greet|plasmalogin' | grep -ciE 'is not a type|is not installed|Cannot assign|ReferenceError|TypeError' || true" '^0$'
          QM click $((W/2)) $((H/4)); sleep 3; shot lock-hello
          QM click $((W-58)) $((H-58)); sleep 2; shot lock-power-menu; QM key esc; sleep 1; QM click $((W/2)) $((H/4)); sleep 1
          QM type wrongpass; QM key ret; sleep 4; shot lock-wrong-password # one wrong try (5 lock the account)
          chk "greeter QML has no errors after a wrong password" 0 "journalctl -b --no-pager | grep -E 'kscreenlocker_greet|plasmalogin' | grep -ciE 'is not a type|is not installed|Cannot assign|ReferenceError|TypeError|mtOk|mtLocale' || true" '^0$'
          chk "a wrong password keeps the screen locked" 1 "$SS" 'boolean true'
          QM click $((W/2)) $((H/4)); sleep 2
          QM type $LPW; QM key ret; sleep 6; shot unlocked
          chk "password unlocks" 1 "$SS" 'boolean false'
          # the long steps below must not lock the screen when idle
          R "$LT kwriteconfig6 --file kscreenlockerrc --group Daemon --key Autolock false; $LT dbus-send --session --type=method_call --dest=org.freedesktop.ScreenSaver /ScreenSaver org.kde.screensaver.configure" || true
          chk "failed units (desktop)" 0 "systemctl --failed --no-legend | wc -l | xargs test 0 -eq && echo none" '^none$'

          # helpers and files more than one part uses (here so a quick run can skip the part that made them)
          R "echo  | base64 -d > /tmp/names.py && chmod 644 /tmp/names.py"
          R "printf '%s' 'for (const w of workspace.windowList()) console.warn(\"CAP|\" + w.caption + \"|\" + w.desktopFileName);' > /tmp/caps.js; chmod 644 /tmp/caps.js"
          mkdir -p perf # the app-open timing (apps part) writes perf/opent.txt
          caps() { local s n0; n0=$(R "journalctl -b --no-pager | grep -c 'CAP|'"); s=$(R "$LT dbus-send --session --print-reply --dest=org.kde.KWin /Scripting org.kde.kwin.Scripting.loadScript string:/tmp/caps.js string:caps-$1" | awk '/int32/{print $2}'); R "$LT dbus-send --session --print-reply --dest=org.kde.KWin /Scripting/Script$s org.kde.kwin.Script.run" >/dev/null; sleep 2; R "for _ in \$(seq 10); do [ \$(journalctl -b --no-pager | grep -c 'CAP|') -gt $n0 ] && break; sleep 1; done"; }
          apwait() { for _ in $(seq 60); do R "test -e '$1'" || return 0; sleep 3; done; return 1; }
          opent() { # label "command" process-pattern
            local m0 m t0 t i out=""
            for i in cold warm; do
              echo "screendump /tmp/o.ppm" | Q >/dev/null; m0=$(sudo md5sum < /tmp/o.ppm)
              echo "$1 $i start $(R "cut -d' ' -f1 /proc/uptime")" >> perf/opent.txt
              t0=$(date +%s%N); L $2
              while :; do
                t=$(( ( $(date +%s%N) - t0 ) / 1000000 ))
                echo "screendump /tmp/o.ppm" | Q >/dev/null; m=$(sudo md5sum < /tmp/o.ppm)
                [ "$m" != "$m0" ] && break; [ $t -ge 30000 ] && break; sleep 0.05
              done
              # X-button close of the main window (a TERM to VS Code, all processes or the main one, crashed it: "GPU process isn't usable"); pkill only for what is left
              out="$out $i=${t}ms"; sleep 12; p=$(R "pgrep -o -u looktest -f '$3'" || true)
              { echo "$1 $i close $(R "cut -d' ' -f1 /proc/uptime") main=$p"; R "pgrep -a -u looktest -f '$3' | cut -c1-160"; } >> perf/opent.txt 2>&1 || true
              [[ $p =~ ^[0-9]+$ ]] && XC $p
              { echo "$1 $i after-x $(R "cut -d' ' -f1 /proc/uptime")"; R "pgrep -a -u looktest -f '$3' | cut -c1-160"; } >> perf/opent.txt 2>&1 || true
              K -f "$3"; sleep 3
            done
            echo "| open $1 (cold/warm) | INFO |$out |" >> report.md; echo "open $1:$out"
          }

          if part gui; then
          # 2. start menu -> settings
          QM key meta_l; sleep 3; shot start-menu
          QM type firewall; sleep 3; shot start-search-firewall; QM key esc; sleep 1 # Mountain's Security, no KDE or firewalld pages
          QM move $((1180*W/1280)) $((780*H/800)); sleep 3; shot taskbar-hover-clock; QM move $((640*W/1280)) $((400*H/800))
          QM rclick $((1000*W/1280)) $((780*H/800)); sleep 2; shot taskbar-context-menu; QM key esc; sleep 1
          QM key esc; sleep 1 # closes Start too (it stayed open after the search above): the Win key below opens it, never closes it
          QM key meta_l; sleep 3; QM move $((936*W/1280)) $((155*H/800)); sleep 1; shot start-all-pill-hover
          QM click $((936*W/1280)) $((155*H/800)); sleep 2; shot start-all-apps
          QM click $((936*W/1280)) $((155*H/800)); sleep 2; shot start-back-to-pinned; QM key esc; sleep 1
          # the Win key toggles Start: it must be open for the All pill steps (an earlier Esc only clears the search; the taskbar menu's Esc leaves Start open)
          sdw() { convert "$(ls shots/*-$1.png | tail -1)" -negate - 2>/dev/null | tesseract - stdout --psm 11 2>/dev/null; } # OCR words of a shot (dark UI: inverted)
          for s in "start-all-pill-hover:for apps:Pinned" "start-all-apps:for apps:" "start-back-to-pinned:Pinned:"; do
            IFS=: read -r sn sw sx <<<"$s"; o=$(sdw "$sn"); ok=PASS
            grep -qi -- "$sw" <<<"$o" || ok=FAIL
            if [ "$sn" = start-all-apps ] && grep -qi 'Pinned' <<<"$o"; then ok=FAIL; fi # the All apps list replaces the pinned grid
            echo "| Start open in step $sn | $ok | needs \"$sw\" |" >> report.md; echo "$ok Start open in step $sn"
          done
          QM key meta_l; sleep 3; QM type calc; sleep 3; shot start-search-best-match; QM key esc; QM key esc; sleep 1
          chk "start search has Best match" 0 "grep -c 'i18n(\"Best match\")' /usr/share/plasma/plasmoids/menu.11.enhanced/contents/ui/ItemMultiGridView.qml" '^1$'
          chk "Start footer has the Windows 11 darker band (U31, see start-menu shot)" 0 "grep -c 'id: footerBand' /usr/share/plasma/plasmoids/menu.11.enhanced/contents/ui/MenuRepresentation.qml" '^1$'
          chk "Start geometry normal vs search (U21: same y/h means the shift is KWin's)" 2 "journalctl -b --no-pager -t plasmashell | grep -o 'mountain-start geometry.*' | tail -6 | paste -sd' '" 'mountain-start geometry'
          QM key meta_l; sleep 3 # the start menu open again for the steps below
          chk "menu.11.enhanced no QML errors" 0 "journalctl -b --no-pager -t plasmashell | grep -E 'menu\.11\.enhanced|org\.mountain' | grep -ciE 'is not a type|is not installed|Cannot assign|ReferenceError|TypeError|Error loading' || true" '^0$'
          chk "start launcher applet in appletsrc" 0 "grep -c '^plugin=menu.11.enhanced$' ~looktest/.config/plasma-org.kde.plasma.desktop-appletsrc" '^1$'
          chk "start menu uses the glass background" 0 "grep -c 'StandardBackground' /usr/share/plasma/plasmoids/menu.11.enhanced/contents/ui/MenuRepresentation.qml" '^1$'
          chk "start menu pin labels wrap to 2 lines" 0 "grep -c 'maximumLineCount: 2' /usr/share/plasma/plasmoids/menu.11.enhanced/contents/ui/ItemGridDelegate.qml" '^1$'
          QM type settings; sleep 3; shot search-settings
          QM key ret
          PGF=-f wchk "start menu opens Settings" 1 org.mountain.settings 20; sleep 6; shot settings
          chk "Settings opened from Start is the active window (in front, with focus)" 0 "journalctl -b --no-pager | grep -o 'MWC|act|[^|]*|[^|]*|[^|]*|[^|]*' | tail -1" 'plasmawindowed\|org.mountain.settings\|Settings'
          # Windows 11 style Settings: maximize, then every category in the sidebar, then search
          QM key meta_l pgup; sleep 3; shot settings-home
          i=0
          for c in system bluetooth network personalization apps accounts time gaming accessibility privacy updates; do
            i=$((i+1)); QM click $((150*W/1280)) $(( (167 + 36*i) * H/800 )); sleep 2; shot "settings-$c"
          done
          QM click $((150*W/1280)) $(( (167 + 36*3) * H/800 )); sleep 3; shot settings-network-page
          chk "Settings Network page loads (no QML errors)" 0 "journalctl -b --no-pager | grep -E 'NetworkPage.qml' | grep -ciE 'is not a type|is not installed|ReferenceError|TypeError|Error loading' || true" '^0$'
          QM key tab; sleep 1; shot settings-nav-focus # white focus ring vs the selected pill
          for q in bluetooth wallpaper display; do

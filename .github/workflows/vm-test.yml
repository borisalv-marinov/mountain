          QM key ret; sleep 6; shot settings-search-open # Enter opens the first result inside Mountain Settings
          chk "search result opens inside Settings (no KDE window)" 0 "pgrep -u looktest -f 'systemsettings|kcmshell6' || echo none" '^none$'
          K -f org.mountain.settings; K -x systemsettings; K -x kdebugsettings
          # Settings > Personalization > Background: native page, applying a picture and a solid color changes the desktop
          L "/usr/libexec/mountain-settings-open background"; PGF=-f wchk "Settings opens on Background" 0 org.mountain.settings 20; sleep 8; shot settings-background
          R "$LT /usr/libexec/mountain-background picture /usr/share/wallpapers/mountain-peaks/ 2" > bg-apply.txt 2>&1; sleep 15
          chk "Background: a picture is applied to the desktop" 0 "grep '^Image=' ~looktest/.config/plasma-org.kde.plasma.desktop-appletsrc | sort -u | paste -sd' '" 'Image=file:///usr/share/wallpapers/mountain-peaks/'
          shot settings-background-peaks
          R "$LT /usr/libexec/mountain-background color '#0078D4'" >> bg-apply.txt 2>&1; sleep 15; shot settings-background-color
          chk "Background: solid color" 0 "grep -E '^(wallpaperplugin=org.kde.color|Color=)' ~looktest/.config/plasma-org.kde.plasma.desktop-appletsrc | sort -u | paste -sd' '" 'org.kde.color'
          chk "Background: status" 2 "$LT /usr/libexec/mountain-background status | paste -sd' '" 'plugin=org.kde.color'
          # v7 glass over a bright wallpaper: white desktop, Start menu, then File Explorer over a white window (blur and tint must stay dark)
          K -f org.mountain.settings; R "$LT /usr/libexec/mountain-background color '#FFFFFF'" >> bg-apply.txt 2>&1; sleep 12
          QM key meta_l; sleep 3; shot start-menu-bright-wallpaper; QM key esc; sleep 1
          L kwrite; sleep 6; L dolphin; sleep 7; shot explorer-over-white-window; K -x dolphin; K -x kwrite
          chk "KWin blur effect is loaded" 0 "$LT dbus-send --session --print-reply --dest=org.kde.KWin /Effects org.kde.kwin.Effects.isEffectLoaded string:blur | awk '/boolean/{print \$2}'" '^true$'
          chk "KWin contrast effect is loaded" 2 "$LT dbus-send --session --print-reply --dest=org.kde.KWin /Effects org.kde.kwin.Effects.isEffectLoaded string:contrast | awk '/boolean/{print \$2}'" '^true$'
          R "$LT /usr/libexec/mountain-background color '#0078D4'" >> bg-apply.txt 2>&1; sleep 12
          # v7 Settings pages are native: no KDE System Settings or kcmshell6 window opens for them
          declare -A PT=([display]="Display" [sound]="Sound" [bluetooth]="Bluetooth" [nightlight]="Night light" [language]="Language & region" [typing]="Typing" [notifications]="Notifications" [mouse]="Mouse & touchpad" [defaultapps]="Default apps" [power]="Power & battery" [about]="About" [storage]="Storage" [startup]="Startup apps" [datetime]="Date & time" [lockscreen]="Lock screen" [colors]="Colors" [controllers]="Game controllers" [printers]="Printers & scanners" [youraccount]="Your account")
          # the page title must be on screen over AT-SPI (a blank or solid window has none)
          for p in display sound bluetooth nightlight language typing notifications mouse defaultapps power about storage startup datetime lockscreen colors controllers printers youraccount; do
            L --setenv=QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1 "/usr/libexec/mountain-settings-open $p"; PGF=-f wchk "Settings opens on $p" 0 org.mountain.settings 20; sleep 6; shot "settings-$p"
            R "$LT python3 /tmp/names.py plasmawindowed 20 > /tmp/set-names.txt 2>&1; true"
            chk "Settings $p: page shows its title" 0 "grep -ciF '${PT[$p]}' /tmp/set-names.txt" "^[1-9]"
            if [ "$p" = storage ]; then chk "Settings Storage: one Local Disk (C:), no /etc or /boot drive" 0 "echo etc=\$(grep -c '^/etc' /tmp/set-names.txt) boot=\$(grep -c '^/boot' /tmp/set-names.txt) c=\$(grep -c 'Local Disk (C:)' /tmp/set-names.txt)" '^etc=0 boot=0 c=[1-9]'; fi
            chk "Settings $p: no systemsettings or kcmshell6" 0 "pgrep -u looktest -f 'systemsettings|kcmshell6' || echo none" '^none$'
            K -f org.mountain.settings
          done
          chk "Settings pages load without QML errors" 0 "journalctl -b --no-pager | grep -E 'org.mountain.settings/contents/ui/[A-Za-z]+Page.qml' | grep -ciE 'ReferenceError|TypeError|is not a type|is not installed|Error loading|Cannot assign' || true" '^0$'
          chk "no QML id masks a global" 0 "journalctl -b --no-pager | grep -c 'illegally masks' || true" '^0$'
          chk "tray layout indicator says ENG" 0 "grep -h '^DisplayNames=' /etc/xdg/kxkbrc ~looktest/.config/kxkbrc 2>/dev/null | tail -1" 'ENG'
          R "$LT /usr/libexec/mountain-background picture /usr/share/wallpapers/mountain-silk/ 2" >> bg-apply.txt 2>&1; sleep 3 # back to the default for the later shots

          QM key meta_l d; sleep 2; QM rclick $((700*W/1280)) $((300*H/800)); sleep 2; shot fhd-menu-context; QM key esc
          R "$KS output.$OUT.mode.1280x800@60" >/dev/null 2>&1; sleep 6; shot back-to-1280

          QM key meta_l; sleep 3; QM click $((937*W/1280)) $((700*H/800)); sleep 2; shot start-power-menu; QM key esc; QM key esc
          # perf data (non-fatal) while the session is still up
          mkdir -p perf
          P() { R "$1" > "perf/$2.txt" 2>&1 || true; } # cmd, filename
          P "uptime; free -m; cat /proc/pressure/memory /proc/pressure/cpu; ps -eo rss,pcpu,user,comm --sort=-rss | head -40" ps1
          P "top -b -n 2 -d 5 | head -40" top

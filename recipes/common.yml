---
modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: script
    scripts:
      - branding.sh
      - kde-defaults.sh

  - type: dnf
    repos:
      files:
        - https://packages.microsoft.com/yumrepos/vscode/config.repo
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc
    install:
      packages:
        - code
        - python3
        - python3-pip
        - git
        - orca # v7.5 Narrator (Settings > Accessibility, Win+Ctrl+Enter); pulls speech-dispatcher + espeak-ng
        - kvantum
        - kvantum-data
        - papirus-icon-theme
        - We10X-icon-theme
        - /usr/bin/rsvg-convert
        - egl-utils
        - nodejs
        - npm
        - libxml2
        - gwenview
        - okular
        - haruna
        - kcalc # Calculator
        - kclock # Clock (alarms, timer, stopwatch)
        - kolourpaint # Paint
        - kamoso # Camera
        - krecorder # Sound Recorder
        - skanlite # Scanner
        - spectacle # Snipping Tool (Win+Shift+S)
        - usbguard # USB protection, opt-in (Security > Device security)
        - kdialog # Win+X menu
        - inotify-tools # Active Protection watcher
        - efibootmgr # Restart into Windows
        - kio-gdrive # Google Drive in File Explorer after signing in under Online accounts
        - clamav # virus scan on demand (Settings > Privacy & security)
        - clamav-update # freshclam, run by the daily timer and by Update definitions / Scan now
        - greenboot # a new system that fails its health checks at boot is rolled back automatically
    remove:
      packages:
        - krfb # KDE Desktop Sharing: its remote-control prompt pre-ticks "allow without asking next time"; nothing in Mountain uses it

  - type: script
    scripts:
      - kvantum-glass.sh
      - sddm-background.sh
      - app-icons.sh
      - windows-names.sh
      - explorer-title.sh
      - explorer-free-space.sh
      - desktop-drag-fix.sh
      - lock-screen.sh
      - process-table.sh
      - mountain-desktop-labels.sh
      - icons-finalize.sh
      - hardening.sh
      - protection.sh

  - type: default-flatpaks
    configurations:
      - notify: false # no "Automatic Flatpak Installation Service" toast on first boot
        scope: system
        install:
          - dev.vencord.Vesktop
          - com.discordapp.Discord
          - com.microsoft.Edge
          - com.brave.Browser
          - org.onlyoffice.desktopeditors
          - com.heroicgameslauncher.hgl
          - org.mozilla.firefox
          - org.gnome.World.PikaBackup # Settings > Security > Back up my files
      - scope: user

  - type: systemd
    system:
      enabled:
        - mountain-gpu-check.service
        - scx_loader.service # LAVD scheduler (config /etc/scx_loader.toml)
        - mountain-avatars.service # logo as login-screen picture (AccountsService)
        - mountain-avatars.path # same for accounts created later
        - mountain-snapshot.timer # hourly read-only home snapshots (Previous versions)
        - mountain-flatpak-policy.service # tighter sandbox for shipped chat/browser/office apps
        - rpm-ostreed-automatic.timer # system updates download in the background (policy stage), applied at the next restart
        - greenboot-healthcheck.service # boot health checks; failing boot_counter times rolls back to the previous system
        - mountain-signed-origin.service # a rebase-installed PC gets a signature-enforced origin
        - mountain-virus-definitions-auto.timer # virus definitions download by themselves: a minute after start, then daily (owner, 21 Nov)
        - mountain-app-updates.timer # Flatpak apps (all browsers) update once a day, quietly, not on metered networks
        - mountain-protect-guard.service # root service: Active Protection stopped, frozen or paused by a program (not the admin password) is put back within 5 s
      disabled:
        - input-remapper.service # controller remapping daemon (~90 MB); advanced users can enable it
        - uupd.timer # also updates Flatpaks/distrobox; system updates come from rpm-ostreed-automatic.timer
        - dnf-makecache.timer # package metadata refresh, useless on an image-based system
        - rpm-ostree-countme.timer # usage counting ping
        - ModemManager.service # mobile-broadband modems only
    user:
      enabled:
        - mountain-protect.service # Active Protection: real-time, local-only, light (watcher only; scans on demand)
        - mountain-gamemode.service # Game Mode: full power while a game runs (one pgrep every 5 s)
        - mountain-app-updates.timer # the user's own Flatpak apps, same rules
      masked:
        - kunifiedpush-distributor.service # push notifications for KDE apps Mountain doesn't ship

  - type: initramfs # boot splash watermark lives in the initramfs

  - type: signing

  # last module: a failing check stops the build before anything is pushed (CI copies tests/check-image.sh here first;
  # for a build on your own PC run `cp tests/check-image.sh files/scripts/` before `bluebuild build`)
  - type: script
    scripts:
      - check-image.sh

---
modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: script
    scripts:
      - branding.sh
      - kde-defaults.sh

  - type: dnf
    repos:
      files:
        - https://packages.microsoft.com/yumrepos/vscode/config.repo
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc
    install:
      packages:
        - code
        - python3
        - python3-pip
        - git
        - kvantum
        - kvantum-data
        - papirus-icon-theme
        - We10X-icon-theme
        - /usr/bin/rsvg-convert
        - egl-utils
        - nodejs
        - npm
        - libxml2
        - gwenview
        - okular
        - haruna
        - kcalc # Calculator
        - kclock # Clock (alarms, timer, stopwatch)
        - kolourpaint # Paint
        - kamoso # Camera
        - krecorder # Sound Recorder
        - skanlite # Scanner
        - spectacle # Snipping Tool (Win+Shift+S)
        - kio-gdrive # Google Drive in File Explorer after signing in under Online accounts
        - clamav # virus scan on demand (Settings > Privacy & security)
        - clamav-update # freshclam, run only when you click Scan now

  - type: script
    scripts:
      - kvantum-glass.sh
      - sddm-background.sh
      - app-icons.sh
      - windows-names.sh
      - explorer-title.sh
      - desktop-drag-fix.sh
      - lock-screen.sh
      - icons-finalize.sh
      - hardening.sh
      - protection.sh

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - dev.vencord.Vesktop
          - com.discordapp.Discord
          - com.microsoft.Edge
          - org.onlyoffice.desktopeditors
          - com.heroicgameslauncher.hgl
          - org.mozilla.firefox
      - scope: user

  - type: systemd
    system:
      enabled:
        - mountain-gpu-check.service
        - scx_loader.service # LAVD scheduler (config /etc/scx_loader.toml)
        - mountain-avatars.service # logo as login-screen picture (AccountsService)
        - mountain-avatars.path # same for accounts created later
        - mountain-snapshot.timer # hourly read-only home snapshots (Previous versions)
        - mountain-flatpak-policy.service # tighter sandbox for shipped chat/browser/office apps
      disabled:
        - input-remapper.service # controller remapping daemon (~90 MB); advanced users can enable it
        - uupd.timer # owner's choice: no background updates; "Updates" app runs one on click
        - dnf-makecache.timer # package metadata refresh, useless on an image-based system
        - rpm-ostree-countme.timer # usage counting ping
        - ModemManager.service # mobile-broadband modems only
    user:
      masked:
        - kunifiedpush-distributor.service # push notifications for KDE apps Mountain doesn't ship

  - type: initramfs # boot splash watermark lives in the initramfs

  - type: signing

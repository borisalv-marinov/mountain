---
modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: rpm-ostree
    repos:
      - https://packages.microsoft.com/yumrepos/vscode/config.repo
    install:
      - code
      - python3
      - python3-pip
      - git

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - dev.vencord.Vesktop
          - com.discordapp.Discord
          - com.microsoft.Edge
      - scope: user

  - type: signing

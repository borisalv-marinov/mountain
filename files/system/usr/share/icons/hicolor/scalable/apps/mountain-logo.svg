<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2131"/>
      <stop offset="1" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- light shadow on the sunlit faces -->
  <path d="M50 30 L76 106 L52 106 Z" fill="url(#shade)"/>
  <path d="M84 44 L112 92 L92 92 Z" fill="url(#shade)" opacity="0.8"/>
  <g fill="none" stroke="#ffffff" stroke-linejoin="miter" stroke-miterlimit="12">
    <!-- tall peak: its right flank keeps going down through the second one -->
    <path d="M12 104 L50 28 L77 108" stroke-width="6"/>
    <!-- second, lower peak behind it -->
    <path d="M62 64 L84 42 L114 90" stroke-width="5"/>
    <!-- ridge line crossing both, like the sketch -->
    <path d="M36 60 C54 64 72 68 106 67" stroke-width="2.6" stroke-opacity="0.85" stroke-linecap="round"/>
  </g>
</svg>

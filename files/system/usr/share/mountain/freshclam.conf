# Mountain: freshclam settings for mountain-virus-definitions.service, used instead of /etc/freshclam.conf.
# Fedora's file logs to /var/log/freshclam.log (missing or not writable by the update user on an image-based system:
# "Initialization error!" before any download), so this one has no log file: the output goes to the journal.
DatabaseDirectory /var/lib/clamav
DatabaseOwner clamupdate
DatabaseMirror database.clamav.net
Checks 1

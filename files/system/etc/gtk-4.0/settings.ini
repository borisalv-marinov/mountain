# Mountain: GTK apps get the same look as the rest of the system (dark, same font and icons, Windows button order).
# KDE copies its own settings over these per user when it runs (kde-gtk-config); these are the system-wide defaults.
[Settings]
gtk-application-prefer-dark-theme=true
gtk-font-name=Noto Sans 10
gtk-icon-theme-name=We10X-dark
gtk-decoration-layout=:minimize,maximize,close
